<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show da Vibração</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: palco de jogo, celular primeiro. Barra fixa no topo, cartão da pergunta, ações no rodapé (polegar).
   A partir de 960px: figura/enunciado à esquerda, jogo à direita. Tema único escuro, escolhido de propósito. */
:root {
  color-scheme: dark;
  --bg: #0a0f1e; --bg2: #0f1630; --panel: #141c35; --panel2: #1b2546; --line: #29355e; --ink: #eef2ff; --muted: #9ba7cb;
  --accent: #4fd1ff; --accent-ink: #03131d; --accent-soft: rgba(79, 209, 255, .13);
  --gold: #f5c451; --gold-ink: #241800; --ok: #3ddc97; --ok-bg: rgba(61, 220, 151, .15); --bad: #ff6b7a; --bad-bg: rgba(255, 107, 122, .15);
  --hint: #f5c451; --hint-bg: rgba(245, 196, 81, .12); --paper: #0d1430; --plate: #ffffff;
  --f-display: "Chakra Petch", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --r: 16px;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { margin: 0; color: var(--ink); font: 400 16px/1.5 var(--f-body); min-height: 100vh;
  background: radial-gradient(900px 520px at 50% -140px, #1d2c66 0%, rgba(29, 44, 102, 0) 70%), var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
#app { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.kicker { font: 600 11px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

/* barra do topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 0;
  background: linear-gradient(var(--bg) 70%, rgba(10, 15, 30, 0)); }
.top .ttl { flex: 1; min-width: 0; display: grid; line-height: 1.2 }
.top .ttl b { font: 700 18px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.brand { flex: 1; display: flex; align-items: center; gap: 10px; font: 700 17px var(--f-display) }
.logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink) }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none }
.iconbtn:active { transform: scale(.96) }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.pill.gold { color: var(--gold); border-color: rgba(245, 196, 81, .4) }
.prog { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin: 0 0 14px }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 3px; transition: width .3s }

/* menu */
.menu { display: grid; gap: 14px; padding-top: 4px }
.hello { padding: 8px 2px 4px; display: grid; gap: 8px }
.hello h1 { font-size: clamp(28px, 8vw, 44px); line-height: 1.05 }
.hello h1 em { font-style: normal; color: var(--accent) }
.lead { margin: 0; color: var(--muted); max-width: 60ch }
.stats { display: flex; flex-wrap: wrap; gap: 8px }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; text-align: left }
.tile p { margin: 0; color: var(--muted) }
.tile h2 { font-size: 22px }
.feature { position: relative; overflow: hidden; border: 1.5px solid rgba(245, 196, 81, .55); background: radial-gradient(420px 220px at 100% 0%, rgba(245, 196, 81, .22), rgba(245, 196, 81, 0) 70%), var(--panel2); padding: 22px 18px }
.feature h2 { font-size: clamp(28px, 7vw, 38px); color: var(--gold) }
.feature .go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: var(--gold); color: var(--gold-ink); font: 700 17px var(--f-display); margin-top: 4px }
.feature .coins { font: 600 13px var(--f-mono); color: var(--gold) }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px }
.chipbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 500; font-size: 15px }
.chipbtn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700 }
.chipbtn:active { transform: scale(.97) }
.list { display: grid; gap: 8px }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); text-align: left; min-height: 56px }
.row .n { font: 700 13px var(--f-mono); color: var(--accent); width: 34px }
.row small { display: block; color: var(--muted); font-size: 12px }
.dots { display: flex; gap: 3px } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line) } .dots i.done { background: var(--ok) } .dots i.part { background: var(--gold) }
.how summary { cursor: pointer; font: 700 16px var(--f-display); list-style: none } .how summary::-webkit-details-marker { display: none }
.how ol { margin: 0; padding-left: 20px; color: var(--muted) } .how code { font-family: var(--f-mono); color: var(--accent) }

/* palco (jogo) */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start }
.ref, .play, .card-q, .refcard { min-width: 0 }
.menu { grid-template-columns: minmax(0, 1fr) }
.play { display: grid; gap: 12px; min-width: 0 }
.refcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line) }
.tab { flex: 1; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px }
.tab.on { background: var(--panel2); color: var(--ink) }
.tabpane { padding: 10px }
.tabpane.off, .refcard.min .tabpane { display: none }
.tabpane p { margin: 0 0 8px; font-size: 15px } .tabpane .note { color: var(--muted); font-size: 14px }
.plate { background: var(--plate); border-radius: 12px; padding: 6px; display: grid; place-items: center }
.plate.gen { background: var(--panel2) }
.plate img { max-width: 100%; max-height: 26vh; width: auto; height: auto; display: block }
.plate svg { width: 100%; max-height: 26vh }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted) }
.legend span { font-size: 15px; color: var(--ink); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px }
.phases { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.phases::-webkit-scrollbar { display: none }
.phases button { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted) }
.phases button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700 }
.phases button.done:not(.on) { color: var(--ok); border-color: rgba(61, 220, 151, .5) }
.card-q { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 14px }
.q { font-size: 18px; line-height: 1.45; font-weight: 500 }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 10px 14px 10px 10px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel2); font-size: 16px; transition: border-color .15s, background .15s }
.opt .let { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--f-display); background: var(--bg2); color: var(--accent); border: 1px solid var(--line) }
.opt:active:not(:disabled) { transform: scale(.985) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(79, 209, 255, .15) }
.opt.sel .let { background: var(--accent); color: var(--accent-ink) }
.opt.ok { border-color: var(--ok); background: var(--ok-bg) } .opt.ok .let { background: var(--ok); color: #03140c }
.opt.bad { border-color: var(--bad); background: var(--bad-bg) } .opt.bad .let { background: var(--bad); color: #22040a }
.opt.gone { opacity: .18 }
.opt:disabled { cursor: default }
.exprrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.lhs { font: 500 19px var(--f-body); white-space: nowrap }
.exprrow input, .num input { flex: 1; min-width: 0; width: 100%; font: 500 18px var(--f-mono); height: 52px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink) }
.exprrow input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(79, 209, 255, .18) }
.preview { min-height: 28px; font-size: 19px } .preview.err { font-size: 14px; color: var(--bad) }
.preview .lab { font: 600 10px var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-right: 8px }
.keys { display: grid; gap: 8px }
.keys div { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.keys div::-webkit-scrollbar { display: none }
.keys small { flex: none; font: 600 10px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; width: 58px }
.chip { flex: none; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); font-size: 17px }
.chip.op { color: var(--accent); font-weight: 700 }
.chip:active { transform: scale(.94); background: var(--accent-soft) }
.match { display: grid; gap: 10px }
.match label { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 19px }
.match select { font: 15px var(--f-body); height: 48px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); min-width: 0; width: 100% }
.match select.ok { border-color: var(--ok); background: var(--ok-bg) } .match select.bad { border-color: var(--bad); background: var(--bad-bg) }
.fb { border-radius: 14px; padding: 12px 14px; font-size: 15px; display: grid; gap: 6px; border: 1px solid transparent }
.fb.ok { background: var(--ok-bg); border-color: rgba(61, 220, 151, .4) }
.fb.bad { background: var(--bad-bg); border-color: rgba(255, 107, 122, .4) }
.fb.hint { background: var(--hint-bg); border-color: rgba(245, 196, 81, .35) }
.fb b.t { font: 700 16px var(--f-display) } .fb.ok b.t { color: var(--ok) } .fb.bad b.t { color: var(--bad) } .fb.hint b.t { color: var(--gold) }
.fb ul { margin: 0; padding-left: 18px }
.ans { font-size: 19px }
.dock { position: sticky; bottom: 0; z-index: 15; display: flex; gap: 10px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(10, 15, 30, 0), var(--bg) 30%) }
.btn { flex: 1; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); font: 700 16px var(--f-display); letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.btn.ghost { flex: 0 1 auto; background: transparent }
.btn:disabled { opacity: .4; cursor: default }
.btn:active:not(:disabled) { transform: scale(.98) }
.sumcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px }
.sumcard p { margin: 0 } .sumcard .muted { color: var(--muted) }
.eq { font-size: 18px; line-height: 2; overflow-x: auto; padding: 10px 12px; background: var(--paper); border-radius: 12px }
.big-score { text-align: center; padding: 18px 0 6px; display: grid; gap: 4px }
.big-score b { font: 700 clamp(44px, 14vw, 72px)/1 var(--f-display); color: var(--accent) }
.big-score.gold b { color: var(--gold) }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px }
.tally div { background: var(--panel2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted) }
.tally b { display: block; font: 700 22px var(--f-display); color: var(--ink) }

/* Show da Vibração (escada de 16 perguntas) */
.tswitch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; cursor: pointer }
.tswitch small { display: block; font-weight: 400; color: var(--muted); font-size: 13px }
.tswitch input { appearance: none; width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s }
.tswitch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s }
.tswitch input:checked { background: var(--gold) } .tswitch input:checked::after { transform: translateX(20px); background: var(--gold-ink) }
@media (max-width: 480px) { .wide-only { display: none !important } }
.timer { position: relative; height: 26px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; margin-bottom: 12px }
.timer i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .25s linear }
.timer.low i { background: var(--bad) }
.timer span { position: relative; display: grid; place-items: center; height: 100%; font: 700 13px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 1px 2px rgba(0, 0, 0, .6) }
@media (prefers-reduced-motion: reduce) { .timer i { transition: none } }
.money-big { color: var(--gold); font-size: 24px !important }
.ladder { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; scroll-behavior: smooth }
.ladder::-webkit-scrollbar { display: none }
.step { flex: none; min-width: 52px; height: 30px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; font: 600 12px var(--f-mono); background: var(--panel); border: 1px solid var(--line); color: var(--muted) }
.step.won { background: var(--ok-bg); border-color: rgba(61, 220, 151, .5); color: var(--ok) }
.step.now { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); transform: scale(1.06) }
.step.mil { border-color: rgba(245, 196, 81, .6); color: var(--gold) }
.stakes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px }
.stakes span { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.stakes b { display: block; font: 700 15px var(--f-display); color: var(--ink); text-transform: none; letter-spacing: 0 }
.stakes .up b { color: var(--gold) } .stakes .down b { color: var(--bad) }
.lifelines { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.life { display: grid; justify-items: center; gap: 4px; padding: 8px 2px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 11px; color: var(--muted) }
.life .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); color: var(--gold); border: 1.5px solid rgba(245, 196, 81, .45); position: relative }
.life .cnt { position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold); color: var(--gold-ink); font: 700 11px/18px var(--f-mono) }
.life:disabled { opacity: .3 }
.qcard { border-color: rgba(245, 196, 81, .35); background: linear-gradient(var(--panel2), var(--panel)) }
.bars { display: grid; gap: 6px; margin-top: 2px } .bars span { display: grid; grid-template-columns: 18px 1fr 42px; gap: 8px; align-items: center; font-size: 13px }
.bars i { display: block; height: 12px; background: var(--gold); border-radius: 6px }
.votes { display: flex; gap: 8px } .votes span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); font: 700 15px var(--f-display); color: var(--gold) }
.hist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px }
.hist li { background: var(--panel2); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--ok) }
.hist li.badrow { border-left-color: var(--bad) }
.hist .why { color: var(--muted); font-size: 13px; margin-top: 4px }
.egg { margin-left: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(245, 196, 81, .5); background: transparent; color: var(--gold); font-size: 12px; line-height: 1; padding: 0; vertical-align: middle; letter-spacing: 0 }
.eggtxt { display: block; margin-top: 6px; color: var(--gold); text-transform: none; letter-spacing: 0; font: 500 13px var(--f-body) }
.figopt { display: block; background: var(--paper); border-radius: 10px; padding: 4px }
.figopt svg { max-height: 22vh !important }
.ans .lab { display: block; font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px }
.typed { display: grid; gap: 10px }
.trophy { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: rgba(245, 196, 81, .15); color: var(--gold) }
.trophy .ico { width: 38px; height: 38px }

sub, sup { font-size: .72em; line-height: 0 }
.dv { position: relative; display: inline-block }
.dv::after { content: ""; position: absolute; left: 50%; top: -.12em; width: .2em; height: .2em; border-radius: 50%; background: currentColor; transform: translateX(-50%) }
.m { font-family: "Cambria Math", "STIX Two Math", Cambria, Georgia, serif; font-style: normal }

@media (min-width: 960px) {
  .menu { grid-template-columns: 1fr 1fr; align-items: start }
  .hello, .feature { grid-column: 1 / -1 }
  .stage { grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); gap: 20px }
  .ref { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto }
  .tabs { display: none }
  .tabpane.off, .refcard.min .tabpane { display: block }
  .plate img, .plate svg { max-height: 44vh }
  .ladder { flex-wrap: wrap }
}
@media (prefers-reduced-motion: no-preference) {
  .card-q, .sumcard { animation: rise .22s ease-out }
  .pop { animation: pop .45s ease-out } .shake { animation: shake .45s ease-in-out }
  @keyframes rise { from { opacity: .4; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.025); box-shadow: 0 0 0 6px rgba(61, 220, 151, .25) } 100% { transform: scale(1) } }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(7px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }
}

<script>
// Dados do Leitor de Mecanismos. Cada exercício vira uma fila de itens por fase.
// Tipos: choice (opções), number, match (coordenada → o que mede), expr (expressão conferida numericamente).
// expr.mode: "exact" (sinal importa) ou "pm" (aceita ±, para deformações que vão ao quadrado).
// expr.sq: true quando a resposta é um quadrado (v², ω²); o diagnóstico só aponta variáveis faltando/sobrando.
// Velocidades: nome da coordenada + "d" (x1 → x1d, th → thd).

const BODY = [
  "Fixo: não se move",
  "Movimento imposto: é dado, não é coordenada",
  "Sem massa: só liga pontos (vira mola ou haste)",
  "Massa que só translada",
  "Corpo rígido que translada e gira",
  "Corpo rígido que só gira em torno de um pino fixo",
];
const TKIND = ["Não entra (não tem massa)", "Só translação: ½ m v²", "Só rotação: ½ J ω²", "Translação e rotação: ½ m v<sub>CG</sub>² + ½ J ω²"];

const EXS = [];

// Contextos reais: o mesmo mecanismo sorteado é contado como uma máquina de verdade.
// Cada contexto escreve as frases do enunciado; o gabarito não muda.
// Substantivos vêm como [artigo, nome] para montar perguntas ("A carroceria é:").

const cd = (cS, txt) => (cS ? txt(cS) : "");

const SK = {

  // molde = tipo de pergunta, sem os símbolos e números deste sorteio
  ex.items.forEach((it) => { it.tpl = fam + ":" + it.ph + ":" + (it.tpl || String(it.q).replace(/<(i|sub|sup)>[^<]*<\/(i|sub|sup)>/g, "").replace(/<[^>]+>/g, "").replace(/[0-9]/g, "").replace(/\s+/g, " ").trim().slice(0, 48)); });
  return ex;
}
// símbolo para enunciado/figura (HTML)
function sy(id, names) {
  const [b, s] = (names && names[id]) || (id.startsWith("th") ? ["θ", id.slice(2)] : id.startsWith("ph") ? ["φ", id.slice(2)] : [id[0], id.slice(1)]);
  return `<i>${b}</i>${s ? `<sub>${s}</sub>` : ""}`;
}
// combinação "a + b" → string segura para o parser
const sum = (arr) => arr.length ? arr.join(" + ") : "0";
const par = (s) => (/[+\-]/.test(s.trim().replace(/^-/, "")) ? `(${s})` : s);

/* ---------- desenho SVG ---------- */
const INK = "var(--ink)", MUT = "var(--muted)", ACC = "var(--accent)", FOR = "var(--bad)";
const SV = {
  t: (x, y, html, a = "middle", col = INK, size = 15) => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${size}" fill="${col}" font-family="IBM Plex Sans, Arial, sans-serif">${html}</text>`,
  sym: (x, y, id, names, a = "middle", col = INK, extra = "") => {
    const [b, s] = (names && names[id]) || (id.startsWith("th") ? ["θ", id.slice(2)] : id.startsWith("ph") ? ["φ", id.slice(2)] : [id[0], id.slice(1)]);
    return SV.t(x, y, `<tspan font-style="italic">${b}</tspan>${s ? `<tspan font-size="11" dy="4">${s}</tspan><tspan dy="-4"></tspan>` : ""}${extra}`, a, col);
  },
  line: (x1, y1, x2, y2, col = INK, w = 2, dash = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ""} stroke-linecap="round"/>`,
  rot: (x1, y1, x2, y2, inner) => { const L = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; return [L, (s) => `<g transform="translate(${x1},${y1}) rotate(${a})">${s}</g>`]; },
  spring: (x1, y1, x2, y2, col = INK, n = 8, amp = 7) => {
    const [L, wrap] = SV.rot(x1, y1, x2, y2); const lead = Math.min(10, L * 0.15), seg = (L - 2 * lead) / n;
    let d = `M0,0 H${lead}`; for (let i = 0; i < n; i++) d += ` L${lead + seg * (i + 0.5)},${i % 2 ? amp : -amp}`; d += ` L${L - lead},0 H${L}`;
    return wrap(`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`);
  },
  damper: (x1, y1, x2, y2, col = INK) => {
    const [L, wrap] = SV.rot(x1, y1, x2, y2); const m = L / 2;
    return wrap(`<g fill="none" stroke="${col}" stroke-width="1.8"><path d="M0,0 H${m - 4} M${m - 4},-7 V7 M${m - 12},-10 H${m + 10} M${m - 12},10 H${m + 10} M${m + 10},-10 V10 M${m + 10},0 H${L}"/></g>`);
  },
  ground: (x1, x2, y) => { let s = SV.line(x1, y, x2, y, INK, 2); for (let x = x1 + 6; x < x2; x += 12) s += SV.line(x, y, x - 7, y + 8, MUT, 1); return s; },
  wall: (x, y1, y2, side = -1) => { let s = SV.line(x, y1, x, y2, INK, 2); for (let y = y1 + 6; y < y2; y += 12) s += SV.line(x, y, x + side * 8, y + 7, MUT, 1); return s; },
  arrow: (x1, y1, x2, y2, col = ACC, w = 2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 9;
    const p1 = [x2 - h * Math.cos(a - 0.4), y2 - h * Math.sin(a - 0.4)], p2 = [x2 - h * Math.cos(a + 0.4), y2 - h * Math.sin(a + 0.4)];
    return SV.line(x1, y1, x2 - 4 * Math.cos(a), y2 - 4 * Math.sin(a), col, w) + `<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`;
  },
  arc: (cx, cy, r, a1, a2, col = ACC) => { // ângulos em graus, sentido matemático (anti-horário), y para baixo na tela
    const P = (a) => [cx + r * Math.cos(a * Math.PI / 180), cy - r * Math.sin(a * Math.PI / 180)];
    const [x1, y1] = P(a1), [x2, y2] = P(a2); const large = Math.abs(a2 - a1) > 180 ? 1 : 0, sweep = a2 > a1 ? 0 : 1;
    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} ${sweep} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.6"/>`;
  },
  coil: (cx, cy, col = INK) => `<path d="M${cx + 9},${cy} A9,9 0 1 0 ${cx},${cy + 9} A6,6 0 1 0 ${cx + 6},${cy}" fill="none" stroke="${col}" stroke-width="1.5"/>`,
  box: (x, y, w, h, label, names) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--accent-soft)" stroke="${INK}" stroke-width="1.8"/>` + (label ? SV.sym(x + w / 2, y + h / 2 + 5, label, names) : ""),
  dim: (xs, y, labels) => { // cotas horizontais entre estações
    let s = ""; xs.forEach((x) => (s += SV.line(x, y - 6, x, y + 6, MUT, 1)));
    for (let i = 0; i < xs.length - 1; i++) { s += SV.line(xs[i], y, xs[i + 1], y, MUT, 1); s += SV.sym((xs[i] + xs[i + 1]) / 2, y - 7, labels[i], null, "middle", MUT); }
    return s;
  },
  wrap: (w, h, inner, y0 = 0) => `<svg viewBox="0 ${y0} ${w} ${h}" width="100%" role="img" aria-label="Figura do mecanismo sorteado" style="display:block;max-height:46vh">${inner}</svg>`,
};

/* =====================================================================
   Família A: barra rígida sobre apoios
   ===================================================================== */
function genBar() {
  const K = R.pick(SK.bar);
  const nSup = R.int(2, 3);
  const conv = R.flagPick("barConv", ["cg", "ref", "two"]);
  const sups = Array.from({ length: nSup }, (_, i) => ({ key: "ABC"[i], kind: "sup", i: i + 1, type: R.chance(0.45) ? "trem" : "mola", damp: R.chance(0.6) }));
  sups.forEach((s) => { if (s.type === "trem") s.base = R.chance(0.4) ? "z" : "fixa"; });
  let st = sups.slice();
  st.splice(R.int(1, nSup - 1), 0, { key: "G", kind: "G" });
  if (R.chance(0.45)) st.splice(R.int(0, st.length), 0, { key: "P", kind: "P" });
  let fKey = null;
  if (R.chance(0.3)) { const E = { key: "E", kind: "E" }; if (R.chance(0.5)) st.unshift(E); else st.push(E); fKey = "E"; }
  else fKey = R.pick(st.filter((s) => s.kind !== "E").map((s) => s.key));
  const moment = R.flag("barMoment", 0.25);
  const letters = "abcdef".split("");
  const segs = st.slice(1).map((_, i) => letters[i]);
  const idx = Object.fromEntries(st.map((s, i) => [s.key, i]));
  // distância com sinal de i até j (direita positiva) como {sg, str}
  const dist = (i, j) => (i === j ? { sg: 0, str: "0" } : { sg: j > i ? 1 : -1, str: segs.slice(Math.min(i, j), Math.max(i, j)).join(" + ") });
  const sstr = (d) => (d.sg === 0 ? "0" : `${d.sg < 0 ? "-" : ""}(${d.str})`);
  const first = sups[0].key, last = sups[nSup - 1].key;
  let refKey, coords, derived = [], thRule = null, refId;
  if (conv === "cg") { refKey = "G"; refId = "yG"; coords = ["yG", "th"]; }
  else if (conv === "ref") { refKey = R.pick([first, last]); refId = "y" + refKey; coords = [refId, "th"]; }
  else {
    refKey = first; refId = "y" + first; coords = [refId, "y" + last];
    const Dd = dist(idx[first], idx[last]);
    derived = [["D", Dd.str], ["th", `(y${last} - y${first})/D`], ["thd", `(y${last}d - y${first}d)/D`]];
    thRule = `Com θ = (y<sub>${last}</sub> − y<sub>${first}</sub>)/D, a regra é y = y<sub>${first}</sub> + (distância à direita de ${first})·θ, negativa à esquerda de ${first}.`;
  }
  const trem = sups.filter((s) => s.type === "trem");
  trem.forEach((s) => coords.push("y" + s.i));
  const pos = (key, vel = false) => {
    const d = vel ? "d" : "";
    if (conv === "two" && key === last) return "y" + last + d;
    const D = dist(idx[refKey], idx[key]);
    if (D.sg === 0) return refId + d;
    return `${refId}${d} ${D.sg > 0 ? "+" : "-"} (${D.str})*th${d}`;
  };
  // erro típico: braço medido a partir de outro ponto (não da referência)
  const posW = (key, vel = false) => {
    const d = vel ? "d" : "", from = [first, last, "G"].find((k2) => k2 !== refKey && k2 !== key) || first;
    const D = dist(idx[from], idx[key]); return D.sg === 0 ? `${refId}${d} + (${dist(idx[refKey], idx[from]).str})*th${d}` : `${refId}${d} ${D.sg > 0 ? "+" : "-"} (${D.str})*th${d}`;
  };
  const params = ["M", "JG", ...segs, "F"];
  sups.forEach((s) => { params.push("k" + s.i); if (s.damp) params.push("c" + s.i); if (s.type === "trem") { params.push("m" + s.i, "kp" + s.i); if (s.base === "z") params.push("z" + s.i); } });
  if (st.some((s) => s.kind === "P")) params.push("mP");
  if (moment) params.push("M0");
  const nm = {};
  const ord = st.map((s, i) => (i ? ` –${segs[i - 1]}– ` : "") + s.key).join("");

  // enunciado (no contexto sorteado)
  const sent = [];
  sent.push({ tag: "rigid", t: K.intro(nSup, sups.map((s) => s.key).join(", ")) });
  sups.forEach((s) => {
    const kS = sy("k" + s.i), cS = s.damp ? sy("c" + s.i) : null;
    if (s.type === "mola") sent.push({ tag: "sup", t: K.direct(s.key, kS, cS) });
    else {
      sent.push({ tag: "sup", t: K.trem(s.key, kS, cS, sy("m" + s.i), sy("kp" + s.i)) });
      sent.push(s.base === "z" ? { tag: "base", t: K.baseZ(s.key, sy("z" + s.i)) } : { tag: "fixo", t: K.baseFix(s.key) });
    }
  });
  if (params.includes("mP")) sent.push({ tag: "pmass", t: K.pmass(sy("mP")) });
  sent.push({ tag: "force", t: K.force(fKey, sy("F"), fKey === "E", moment ? sy("M0") : null) });
  const yi = trem.map((s) => sy("y" + s.i)).join(", ");
  if (conv === "cg") sent.push({ tag: "coords", t: `Use como coordenadas o deslocamento vertical ${sy("yG")} do centro de massa e a rotação θ da barra${trem.length ? `, além dos deslocamentos verticais ${yi} das rodas` : ""}.` });
  else if (conv === "ref") sent.push({ tag: "coords", t: `Use como coordenadas o deslocamento vertical ${sy(refId)} do ponto ${refKey} da barra e a rotação θ da barra${trem.length ? `, além dos deslocamentos verticais ${yi} das rodas` : ""}.` });
  else sent.push({ tag: "coords", t: `Use como coordenadas os deslocamentos verticais ${sy(refId)} e ${sy("y" + last)} dos pontos ${first} e ${last} da barra${trem.length ? `, além dos deslocamentos verticais ${yi} das rodas` : ""}.` });
  sent.push({ tag: "equil", t: `Os deslocamentos são medidos a partir do equilíbrio estático, a rotação anti-horária é positiva e as rotações são pequenas.` });

  // figura
  const W = 640, H = 360, yb = 150, yg = 320;
  const px = [0]; segs.forEach(() => px.push(px[px.length - 1] + R.int(60, 120)));
  const sc = (W - 150) / px[px.length - 1]; const X = px.map((p) => 75 + p * sc);
  let f = SV.dim(X, 44, segs);
  f += `<rect x="${X[0] - 18}" y="${yb - 8}" width="${X[X.length - 1] - X[0] + 36}" height="16" rx="3" fill="var(--panel)" stroke="${INK}" stroke-width="2"/>`;
  st.forEach((s, i) => {
    const x = X[i];
    if (s.kind === "G") f += `<circle cx="${x}" cy="${yb}" r="6" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/><path d="M${x},${yb - 6} A6,6 0 0 1 ${x + 6},${yb} L${x},${yb} Z M${x},${yb + 6} A6,6 0 0 1 ${x - 6},${yb} L${x},${yb} Z" fill="${INK}"/>`;
    if (s.kind === "P") f += SV.box(x - 16, yb - 34, 32, 26, "mP");
    f += SV.t(x, yb - (s.kind === "P" ? 40 : 14), s.key, "middle", MUT, 13);
    if (s.kind === "sup") {
      const xs = s.damp ? x - 11 : x, xd = x + 13;
      if (s.type === "mola") {
        f += SV.spring(xs, yb + 8, xs, yg, INK); if (s.damp) f += SV.damper(xd, yb + 8, xd, yg);
        f += SV.sym(x - (s.damp ? 30 : 18), (yb + yg) / 2, "k" + s.i, null, "end");
        if (s.damp) f += SV.sym(xd + 16, (yb + yg) / 2 + 18, "c" + s.i, null, "start");
      } else {
        const mb = 222;
        f += SV.spring(xs, yb + 8, xs, mb, INK, 5); if (s.damp) f += SV.damper(xd, yb + 8, xd, mb);
        f += SV.sym(x - (s.damp ? 30 : 18), 192, "k" + s.i, null, "end");
        if (s.damp) f += SV.sym(xd + 16, 200, "c" + s.i, null, "start");
        f += SV.box(x - 24, mb, 48, 28, "m" + s.i);
        f += SV.arrow(x + 32, mb + 26, x + 32, mb + 4); f += SV.sym(x + 38, mb + 18, "y" + s.i, null, "start", ACC);
        const yt = s.base === "z" ? yg - 14 : yg;
        f += SV.spring(x, mb + 28, x, yt, INK, 5); f += SV.sym(x - 14, (mb + 28 + yt) / 2 + 4, "kp" + s.i, null, "end");
        if (s.base === "z") { f += `<rect x="${x - 26}" y="${yt}" width="52" height="8" fill="var(--hint-bg)" stroke="${INK}" stroke-width="1.4"/>`; f += SV.arrow(x + 32, yg + 4, x + 32, yg - 18, FOR); f += SV.sym(x + 38, yg - 2, "z" + s.i, null, "start", FOR, "(t)"); }
      }
    }
  });
  f += SV.ground(30, W - 20, yg);
  const fx = X[idx[fKey]]; f += SV.arrow(fx - 2, yb - 70, fx - 2, yb - 12, FOR); f += SV.sym(fx - 8, yb - 54, "F", null, "end", FOR, "(t)");
  if (conv === "two") { [first, last].forEach((k) => { const x = X[idx[k]] + 18; f += SV.arrow(x, yb - 12, x, yb - 42); f += SV.sym(x + 5, yb - 30, "y" + k, null, "start", ACC); }); }
  else { const x = X[idx[refKey]] + 18; f += SV.arrow(x, yb - 12, x, yb - 42); f += SV.sym(x + 5, yb - 30, refId, null, "start", ACC); }
  const xr = X[X.length - 1] + 30; f += SV.arc(xr, yb, 20, -30, 40); f += SV.arrow(xr + 15.3, yb - 12.9, xr + 12, yb - 17, ACC); f += SV.t(xr + 26, yb - 14, "θ", "start", ACC);
  if (moment) { const xm = X[0] - 34; f += SV.arc(xm, yb, 16, 200, 60, FOR); f += SV.t(xm - 18, yb - 18, `<tspan font-style="italic">M</tspan><tspan font-size="11" dy="4">0</tspan>`, "end", FOR); }

  // itens
  const items = [];
  items.push(readItem(sent, "equil", "Qual frase permite deixar o <b>peso</b> fora de V?", "Medindo a partir do equilíbrio estático, o peso é equilibrado pela pré-carga das molas e os dois se cancelam."));
  items.push(readItem(sent, trem.some((s) => s.base === "z") ? "base" : "coords", trem.some((s) => s.base === "z") ? "Qual frase diz que uma <b>base se move</b> (e por isso não vira coordenada)?" : "Qual frase define as <b>coordenadas</b>?",
    trem.some((s) => s.base === "z") ? "z(t) é imposto pela pista: é um dado. Ele entra na deformação do pneu (y − z)." : "As coordenadas mandam em tudo: todas as posições são escritas com elas."));
  items.push(I.choice("mec", `${nounQ(K.n.body)} é:`, BODY, 4, "Sobe e gira: translação + rotação."));
  if (trem.length) { items.push(I.choice("mec", `${nounQ(K.n.wheel)} (${sy("m" + trem[0].i)}) é:`, BODY, 3, "Anda na vertical entre a suspensão e o pneu: ganha coordenada própria.")); items.push(I.choice("mec", `${nounQ(K.n.tire)} é:`, BODY, 2, "Só uma mola entre a roda e o que está embaixo.")); }
  if (trem.some((s) => s.base === "z")) items.push(I.choice("mec", `${nounQ(K.n.track)} com z(t), sob ${nounL(K.n.tire)}, é:`, BODY, 1, "Movimento imposto z(t): dado do problema."));
  if (params.includes("mP")) items.push(I.choice("mec", `${nounQ(K.n.motor)} no ponto P é:`, BODY, 3, "Massa concentrada presa na barra: anda junto com o ponto P."));
  items.push(I.num("Quantos graus de liberdade?", coords.length, `Barra: 2 (sobe e gira)${trem.length ? `; mais ${trem.length} roda(s)` : ""}.`));
  const descs = { yG: "deslocamento vertical do centro de massa G", th: "rotação da barra (anti-horária positiva)" };
  [first, last, refKey].filter((k) => k !== "G").forEach((k) => (descs["y" + k] = `deslocamento vertical do ponto ${k} da barra`));
  trem.forEach((s) => (descs["y" + s.i] = `deslocamento vertical da roda ${sy("m" + s.i)}`));
  items.push(I.match("O que cada coordenada mede?", coords.map((c) => [c, descs[c]]), ["deformação da suspensão", "rotação da roda", conv === "cg" ? "deslocamento vertical do ponto A" : "deslocamento vertical do centro de massa G"], "Pontos da barra que não são coordenadas saem da translação + rotação."));
  // posições
  if (conv === "two") items.push(I.expr("pos", "θ =", `Rotação da barra (anti-horária positiva), só com ${sy(refId)}, ${sy("y" + last)} e cotas.`, `(y${last} - y${first})/D`, { forbid: ["th", "thd"], hint: "tg θ no triângulo de catetos conhecidos: entre os dois pontos das coordenadas.", why: `D = ${Dstr(st, first, last, segs)} é a distância entre ${first} e ${last}; o cateto oposto é y<sub>${last}</sub> − y<sub>${first}</sub>.` }));
  const posKeys = st.filter((s) => !(conv !== "two" && s.key === refKey) && !(conv === "two" && (s.key === first || s.key === last))).map((s) => s.key);
  R.shuffle(posKeys).slice(0, 3).forEach((k) => items.push(I.expr("pos", `y<sub>${k}</sub> =`, `Deslocamento vertical do ponto <b>${k}</b> da barra.`, pos(k), { wrongs: [posW(k)], tpl: "bar-pos", hint: "Ponto de referência + (distância com sinal) × θ. À direita da referência, +.", why: whyPos(k, refKey, conv, first) })));
  // T
  items.push(I.choice("T", `Em T, ${nounL(K.n.body)} entra com:`, TKIND, 3, conv === "cg" ? "½ M v_G² + ½ J_G θ̇². Com G como referência, sem termo cruzado." : "½ M v_G² + ½ J_G θ̇², com v_G calculada a partir das coordenadas. Como a referência não é G, aparece termo cruzado."));
  items.push(I.expr("T", "v<sub>G</sub>² =", "Velocidade ao quadrado do <b>centro de massa G</b>.", `(${pos("G", true)})^2`, { wrongs: conv === "cg" ? [] : [`(${posW("G", true)})^2`], sq: true, coef: "M", tlabel: "barra (translação)", hint: "Derive a posição de G. T usa a velocidade do centro de massa.", why: conv === "cg" ? "G é coordenada: v_G = ẏ_G." : "G não é a referência: v_G = derivada de (referência + braço·θ). Por isso ½ M v_G² acopla as coordenadas." }));
  items.push(I.expr("T", "ω² =", "Velocidade angular ao quadrado da <b>barra</b>" + (conv === "two" ? " (só com as velocidades das coordenadas)." : "."), conv === "two" ? `((y${last}d - y${first}d)/D)^2` : "thd^2", { sq: true, coef: "JG", tlabel: "barra (rotação)", forbid: conv === "two" ? ["th", "thd"] : undefined, hint: "Derive θ.", why: conv === "two" ? "θ̇ = (ẏ_" + last + " − ẏ_" + first + ")/D." : "ω = θ̇." }));
  if (params.includes("mP")) items.push(I.expr("T", "v<sub>P</sub>² =", "Velocidade ao quadrado do <b>motor</b> (ponto P).", `(${pos("P", true)})^2`, { sq: true, coef: "mP", tlabel: "motor", hint: "Derive a posição de P.", why: "O motor anda junto com o ponto P da barra." }));
  trem.forEach((s) => items.push(I.expr("T", "v² =", `Velocidade ao quadrado da <b>roda ${sy("m" + s.i)}</b>.`, `y${s.i}d^2`, { sq: true, coef: "m" + s.i, tlabel: "roda " + s.i, hint: "Coordenada própria.", why: "ẏ_" + s.i + "." })));
  // V e D
  sups.forEach((s) => {
    if (s.type === "mola") {
      items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("k" + s.i)}</b> (ponto ${s.key} até o chão).`, pos(s.key), { mode: "pm", coef: "k" + s.i, hint: "Ponto da barra − chão (parado).", why: `y_${s.key} − 0.` }));

  if (grav) rods.forEach((r) => {
    const m = r.type === "tip" ? "m" + r.i : "M" + r.i, den = r.type === "tip" ? 2 : 4, sg = r.d === "down" ? "" : "-";
    items.push(I.expr("V", "V<sub>g</sub> =", `Energia potencial da <b>gravidade</b> da haste ${r.i} (${dName[r.d]}), termo inteiro.`, `${sg}${m}*g*l${r.i}*th${r.i}^2/${den}`, { wrongs: [`${sg}${m}*g*l${r.i}*th${r.i}^2/${den / 2}`, `${sg}${m}*g*l${r.i}*th${r.i}^2/${den * 2}`], kind: "term", hint: `A massa sobe ou desce ${r.type === "tip" ? "l" : "(l/2)"}(1 − cos θ) ≈ ${r.type === "tip" ? "l" : "(l/2)"}θ²/2?`, why: r.d === "down" ? "Pendurada: ao girar, a massa sobe ⇒ +½ m g l θ² (estabiliza)." : "Em pé: ao girar, a massa desce ⇒ −½ m g l θ² (desestabiliza)." + (r.type === "bar" ? " Na barra, o CG está a l/2." : "") }));
  });
  // D
  if (blockDamp) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("c0")}</b>.`, "xd", { mode: "pm", coef: "c0", hint: "Parede parada.", why: "ẋ." }));
  rods.filter((r) => r.ct).forEach((r) => items.push(I.expr("D", "Δω =", `Velocidade angular relativa no amortecedor torcional <b>${sy("ct" + r.i)}</b>.`, `th${r.i}d`, { mode: "pm", coef: "ct" + r.i, hint: "Em paralelo com a mola de torção.", why: "θ̇." })));
  // Q
  const qx = fOpt === "torque" ? "0" : "F";
  items.push(I.expr("Q", "Q<sub>x</sub> =", "Força generalizada em <b>x</b>.", qx, { hint: "Mexa só x (θ parados): o ponto da força anda δx?", why: fOpt === "torque" ? "Torque só trabalha em rotação: Q_x = 0." : "Com θ parado, tudo anda δx junto, inclusive o ponto da força: Q_x = F." }));
  if (fRod) {
    let q = "0";
    if (fOpt === "torque") q = "T0"; else if (vert(fRod)) q = `${sgn(fRod) < 0 ? "-" : ""}l${fRod.i}*F`;
    items.push(I.expr("Q", `Q<sub>θ${fRod.i}</sub> =`, `Força generalizada em <b>θ<sub>${fRod.i}</sub></b>.`, q, { hint: "Mexa só essa rotação: quanto o ponto da força anda na direção da força?", why: fOpt === "torque" ? "δW = T₀ δθ." : vert(fRod) ? `A ponta anda ${sgn(fRod) > 0 ? "+" : "−"}l·δθ na horizontal, na direção de F.` : "A ponta de uma haste horizontal anda na vertical, perpendicular a F: Q = 0." }));
  }
  {
    const cand = [[`a rigidez que prende ${nounL(K.n.block)}`, "k0"]];
    rods.forEach((r) => { cand.push([`a rigidez de torção da articulação da peça ${r.i}`, "kt" + r.i]); cand.push([r.type === "tip" ? `${nounL(K.n.tip(r.d))} (peça ${r.i})` : `a massa da peça ${r.i}`, (r.type === "tip" ? "m" : "M") + r.i]); });
    if (tipSpring) cand.push([`a rigidez que segura a ponta da peça ${tipSpring.i}`, "kL"]);
    const pool = params.filter((p) => !/^l\d/.test(p) && !["g", "F", "T0"].includes(p));
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("rods", { ctx: K.id, title: K.title, coords, params, sent, figSVG: SV.wrap(W, H, f), figNote: "Rotações anti-horárias positivas. Desenho na posição de equilíbrio.", items });
}

/* =====================================================================
   Família C: cadeia de trechos rígidos (régua)
   ===================================================================== */
function genChain() {
  const K = R.pick(SK.chain);
  const N = R.int(2, 4), eqL = R.chance(0.5), eqM = R.chance(0.5), eqK = R.chance(0.5), rel = R.flag("chainRel", 0.5);
  const lat = R.flag("chainLat", 0.35) ? R.int(1, N) : 0, damp = R.chance(0.3), fNode = R.chance(0.6) ? N : R.int(1, N);
  const Lid = (j) => (eqL ? "a" : "l" + j), Mid = (j) => (eqM ? "m" : "m" + j), Kid = (j) => (eqK ? "kt" : "k" + j);
  const q = (j) => (rel ? "ph" : "th") + j;
  const coords = Array.from({ length: N }, (_, j) => q(j + 1));
  const params = [...new Set(Array.from({ length: N }, (_, j) => [Lid(j + 1), Mid(j + 1), Kid(j + 1)]).flat())];
  if (lat) params.push("kL"); if (damp) params.push("ct"); params.push("F");
  const absAng = (j, vel) => (rel ? par(Array.from({ length: j }, (_, i) => q(i + 1) + (vel ? "d" : "")).join(" + ")) : q(j) + (vel ? "d" : ""));
  const posN = (k, vel = false) => sum(Array.from({ length: k }, (_, j) => `${Lid(j + 1)}*${absAng(j + 1, vel)}`));
  const defJ = (j, vel = false) => { const d = vel ? "d" : ""; return rel || j === 1 ? q(j) + d : `${q(j)}${d} - ${q(j - 1)}${d}`; };
  // erro típico: tratar ângulo relativo como absoluto (ou o contrário)
  const posNW = (k, vel = false) => sum(Array.from({ length: k }, (_, j) => `${Lid(j + 1)}*${rel ? q(j + 1) + (vel ? "d" : "") : par(Array.from({ length: j + 1 }, (_, i) => q(i + 1) + (vel ? "d" : "")).join(" + "))}`));
  const defJW = (j, vel = false) => { const d = vel ? "d" : ""; return rel && j > 1 ? `${q(j)}${d} - ${q(j - 1)}${d}` : null; };

  const sent = [];
  const list = (fn) => Array.from({ length: N }, (_, j) => sy(fn(j + 1))).join(", ");
  sent.push({ tag: "rigid", t: K.intro(N, eqL ? `iguais a ${sy("a")}` : list(Lid)) });
  sent.push({ tag: "mass", t: K.masses(eqM ? `todas iguais a ${sy("m")}` : list(Mid)) });
  sent.push({ tag: "springs", t: K.springs(eqK ? `todas ${sy("kt")}` : list(Kid), damp ? sy("ct") : null) });
  if (lat) sent.push({ tag: "lat", t: K.lat(lat, sy("kL")) });
  sent.push({ tag: "force", t: K.force(fNode, sy("F")) });
  sent.push({ tag: "coords", t: rel ? `Coordenadas: ${coords.map((c) => sy(c)).join(", ")}, onde φ<sub>1</sub> é o ângulo do trecho 1 com a vertical e cada φ<sub>j</sub> seguinte é o ângulo do trecho j <b>em relação ao trecho de baixo</b> (rotação relativa).` : `Coordenadas: ${coords.map((c) => sy(c)).join(", ")}, os ângulos de cada trecho <b>medidos a partir da vertical</b> (rotações absolutas).` });
  sent.push({ tag: "equil", t: "Despreze a gravidade e considere rotações pequenas." });

  // figura (configuração deformada para mostrar como cada ângulo é medido)
  const W = 560, H = 400, bx = 200, by = 360, segPx = Math.min(118, 300 / N);
  const angs = [12, 22, 29, 34].slice(0, N).map((a) => (a * Math.PI) / 180); // absolutos, inclinando para a direita
  let f = `<rect x="${bx - 40}" y="${by}" width="80" height="14" fill="var(--hint-bg)" stroke="${INK}" stroke-width="1.6"/>` + SV.ground(bx - 60, bx + 60, by + 14);
  let x = bx, y = by; const nodes = [];
  for (let j = 1; j <= N; j++) {
    const a = angs[j - 1], x2 = x + segPx * Math.sin(a), y2 = y - segPx * Math.cos(a);
    f += SV.line(x, y, x2, y2, INK, 4);
    // referência do ângulo
    if (!rel || j === 1) { f += SV.line(x, y, x, y - 56, MUT, 1, "4 4"); f += SV.arc(x, y, 40, 90, 90 - a * 180 / Math.PI); f += SV.sym(x - 6, y - 44, q(j), null, "end", ACC); }
    else { const pa = angs[j - 2]; f += SV.line(x, y, x + 56 * Math.sin(pa), y - 56 * Math.cos(pa), MUT, 1, "4 4"); f += SV.arc(x, y, 40, 90 - pa * 180 / Math.PI, 90 - a * 180 / Math.PI); f += SV.sym(x - 6 + 40 * Math.sin(pa), y - 44 * Math.cos(pa), q(j), null, "end", ACC); }
    f += SV.coil(x - 4, y - 4, MUT);
    f += SV.sym((x + x2) / 2 + 12, (y + y2) / 2 + 10, Lid(j), null, "start", MUT);
    x = x2; y = y2; nodes.push([x, y]);
  }
  f += SV.line(bx, by, bx, by - segPx * N - 10, MUT, 1, "2 6");
  nodes.forEach(([nx, ny], j) => { f += `<circle cx="${nx}" cy="${ny}" r="10" fill="var(--accent-soft)" stroke="${INK}" stroke-width="1.8"/>`; f += SV.t(nx, ny + 4, String(j + 1), "middle", INK, 11); });
  if (lat) { const [nx, ny] = nodes[lat - 1]; f += SV.spring(nx + 10, ny, W - 40, ny); f += SV.wall(W - 40, ny - 24, ny + 24, 1); f += SV.sym((nx + W - 40) / 2, ny - 14, "kL"); }
  { const [nx, ny] = nodes[fNode - 1]; f += SV.arrow(nx - 80, ny, nx - 13, ny, FOR); f += SV.sym(nx - 84, ny + 5, "F", null, "end", FOR, "(t)"); }

  const items = [];
  items.push(readItem(sent, "coords", "Qual frase diz <b>como os ângulos são medidos</b>?", rel ? "Relativos: cada φ é medido a partir do trecho de baixo. O ângulo absoluto do trecho j é φ₁ + … + φⱼ, e cada mola de torção sente só o seu φ." : "Absolutos: cada θ é medido da vertical. A mola de uma junta sente a diferença θⱼ − θⱼ₋₁."));
  items.push(readItem(sent, "rigid", "Qual frase diz que os <b>trechos não entram em T</b>?", "Massa desprezível: só as massas concentradas entram em T."));
  items.push(I.choice("mec", `Cada <b>${K.n.seg[1]}</b> é:`, BODY, 2, "Rígido e sem massa: só liga as massas."));
  items.push(I.choice("mec", `Cada <b>${K.n.mass[1]}</b> é:`, BODY, 3, "Anda na horizontal; posição sai dos ângulos."));
  items.push(I.choice("mec", `${nounQ(K.n.clamp)} é:`, BODY, 0, "Parado."));
  items.push(I.num("Quantos graus de liberdade?", N, `Um ângulo por trecho: ${N}.`));
  const dAbs = (j) => `ângulo do trecho ${j} com a vertical`, dRel = (j) => (j === 1 ? "ângulo do trecho 1 com a vertical" : `ângulo do trecho ${j} em relação ao trecho ${j - 1}`);
  const pairs = coords.slice(0, Math.min(N, 3)).map((c, k) => [c, rel ? dRel(k + 1) : dAbs(k + 1)]);
  const extra = [rel ? dAbs(2) : dRel(2), "deslocamento horizontal da massa " + N].filter((e) => !pairs.some((p) => p[1] === e));
  items.push(I.match("O que cada coordenada mede?", pairs, extra, rel ? "Relativas: medidas a partir do trecho de baixo." : "Absolutas: medidas a partir da vertical."));
  R.shuffle(Array.from({ length: N - 1 }, (_, j) => j + 2)).slice(0, 2).forEach((k) => items.push(I.expr("pos", `x<sub>${k}</sub> =`, `Deslocamento horizontal da <b>massa ${k}</b>.`, posN(k), { wrongs: [posNW(k)], hint: "Some trecho a trecho: cada um contribui comprimento × seu ângulo absoluto.", why: rel ? "Ângulo absoluto do trecho j = φ₁ + … + φⱼ. Some l<sub>j</sub>·(ângulo absoluto) de cada trecho até a massa." : "x<sub>k</sub> = soma de l<sub>j</sub>·θ<sub>j</sub> dos trechos abaixo da massa." })));
  for (let k = 1; k <= N; k++) items.push(I.expr("T", "v² =", `Velocidade ao quadrado da <b>massa ${k}</b>.`, `(${posN(k, true)})^2`, { wrongs: k > 1 ? [`(${posNW(k, true)})^2`] : [], sq: true, coef: Mid(k), tlabel: "massa " + k, hint: "Derive a posição da massa.", why: "Derivada da soma de todos os trechos abaixo dela." }));
  for (let j = 1; j <= N; j++) items.push(I.expr("V", "Δ =", j === 1 ? `Deformação da mola de torção do <b>engaste</b> (${sy(Kid(1))}).` : `Deformação da mola de torção na <b>junta ${j - 1}–${j}</b> (${sy(Kid(j))}).`, defJ(j), { wrongs: [defJW(j)].filter(Boolean), mode: "pm", coef: Kid(j), hint: "Rotação relativa entre os dois lados da mola.", why: rel ? "Com ângulos relativos, cada mola sente só a sua coordenada." : j === 1 ? "O engaste não gira: θ₁ − 0." : `θ<sub>${j}</sub> − θ<sub>${j - 1}</sub>.` }));
  if (lat) items.push(I.expr("V", "Δ =", `Deformação da mola lateral <b>${sy("kL")}</b> (massa ${lat}).`, posN(lat), { mode: "pm", coef: "kL", hint: "Parede parada: deslocamento horizontal da massa.", why: "Δ = x da massa." }));
  if (damp) R.shuffle(Array.from({ length: N }, (_, j) => j + 1)).slice(0, 2).forEach((j) => items.push(I.expr("D", "Δω =", j === 1 ? "Velocidade angular relativa no amortecedor do <b>engaste</b>." : `Velocidade angular relativa no amortecedor da <b>junta ${j - 1}–${j}</b>.`, defJ(j, true), { mode: "pm", coef: "ct", hint: "Em paralelo com a mola de torção.", why: "Derivada da deformação da mola." })));
  R.shuffle(Array.from({ length: N }, (_, j) => j + 1)).slice(0, 2).sort().forEach((i) => {
    let a = "0";
    if (i <= fNode) a = rel ? `F*${par(sum(Array.from({ length: fNode - i + 1 }, (_, t) => Lid(i + t))))}` : `F*${Lid(i)}`;
    if (eqL && rel && i <= fNode) a = `F*${fNode - i + 1}*a`;
    const aw = i > fNode ? `F*${Lid(i)}` : rel ? `F*${Lid(i)}` : `F*${par(sum(Array.from({ length: fNode - i + 1 }, (_, t) => Lid(i + t))))}`;
    items.push(I.expr("Q", `Q<sub>${i}</sub> =`, `Força generalizada em <b>${sy(q(i))}</b>.`, a, { wrongs: [aw], hint: `Mexa só ${rel ? "φ" : "θ"}<sub>${i}</sub>: quanto a massa ${fNode} anda?`, why: i > fNode ? "Esse trecho está acima da massa da força: mexer nele não a move." : rel ? "Mexer φᵢ gira tudo acima da junta i: a massa da força anda (soma dos comprimentos de i até ela)·δφ." : "Mexer θᵢ sozinho move a massa da força l<sub>i</sub>·δθ." }));
  });
  const top = Math.min(...nodes.map((n) => n[1])) - 40;
  {
    const cand = [];
    for (let j = 1; j <= N; j++) { if (!eqM) cand.push([`${nounL(K.n.mass)} ${j}`, Mid(j)]); if (!eqK) cand.push([j === 1 ? `a mola de torção ${K.n.clamp[0] === "a" ? "da" : "do"} <b>${K.n.clamp[1]}</b>` : `a mola de torção da ${K.n.spring} ${j - 1}–${j}`, Kid(j)]); if (!eqL) cand.push([`o comprimento do ${K.n.seg[1]} ${j}`, Lid(j)]); }
    if (lat) cand.push([`a rigidez da ligação lateral (${K.id === "torre" ? "estai" : K.id === "robo" ? "cabo de segurança" : "mola horizontal"})`, "kL"]);
    const pool = params.filter((p) => p !== "F");
    if (pool.length >= 4) R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("chain", { ctx: K.id, title: K.title, coords, params, sent, figSVG: SV.wrap(W, by + 30 - top, f, top), figNote: `Desenho deformado de propósito para mostrar como cada ${rel ? "φ" : "θ"} é medido. Molas de torção no engaste e nas juntas.`, items });
}

/* =====================================================================
   Família D: carrinhos em série
   ===================================================================== */
function genCarts() {
  const K = R.pick(SK.carts);
  const CN = K.n.cart[1];
  const N = R.int(2, 4), rel = R.flag("cartRel", 0.45), eqM = R.chance(0.35), right = R.flag("cartRight", 0.5), moving = right && R.flag("cartMove", 0.45);
  const fCart = R.int(1, N);
  const Mid = (i) => (eqM ? "m" : "m" + i);
  const q = (i) => (rel && i > 1 ? "u" + i : "x" + i);
  const coords = Array.from({ length: N }, (_, i) => q(i + 1));
  const X = (i, vel = false) => { const d = vel ? "d" : ""; return rel ? sum(Array.from({ length: i }, (_, k) => q(k + 1) + d)) : "x" + i + d; };
  const conns = []; // {k, c?, a, b} a/b: índice do carrinho (0 = parede esquerda, N+1 = parede direita)
  for (let i = 0; i <= N; i++) { if (i === N && !right) break; conns.push({ id: i + 1, a: i, b: i + 1, damp: R.chance(0.4) }); }
  const params = [...new Set(Array.from({ length: N }, (_, i) => Mid(i + 1)))];
  conns.forEach((c) => { params.push("k" + c.id); if (c.damp) params.push("c" + c.id); });
  if (moving) params.push("y", "yd"); params.push("F");
  const XW = (i, vel = false) => q(i) + (vel ? "d" : ""); // erro típico: relativa usada como absoluta
  const end = (i, vel) => (i === 0 ? "0" : i === N + 1 ? (moving ? "y" + (vel ? "d" : "") : "0") : X(i, vel));
  const def = (c, vel = false) => {
    if (c.a === 0) return X(1, vel);
    if (c.b === N + 1) return moving ? `${par(X(N, vel))} - y${vel ? "d" : ""}` : X(N, vel);
    if (rel) return q(c.b) + (vel ? "d" : "");
    return `${X(c.b, vel)} - ${X(c.a, vel)}`;
  };
  const sent = [];
  sent.push({ tag: "carts", t: K.intro(N, eqM ? `iguais a ${sy("m")}` : Array.from({ length: N }, (_, i) => sy(Mid(i + 1))).join(", ")) });
  sent.push({ tag: "springs", t: K.springs(conns.filter((c) => c.damp).map((c) => sy("c" + c.id)).join(", ")) });
  if (right) sent.push(moving ? { tag: "base", t: K.right(true, N, sy("k" + (N + 1)), sy("y")) } : { tag: "fixo", t: K.right(false, N, sy("k" + (N + 1))) });
  sent.push({ tag: "force", t: K.force(fCart, sy("F")) });
  sent.push({ tag: "coords", t: rel ? `Coordenadas: ${sy("x1")}, o deslocamento do ${K.n.cart[1]} 1, e ${coords.slice(1).map((c) => sy(c)).join(", ")}, onde ${sy("u2")} = ${sy("x2")} − ${sy("x1")} é o deslocamento de cada ${K.n.cart[1]} <b>em relação ao anterior</b>.` : `Coordenadas: ${coords.map((c) => sy(c)).join(", ")}, os deslocamentos <b>absolutos</b> de cada ${K.n.cart[1]} a partir do equilíbrio.` });

  const W = 640, H = 220, yb = 110, bw = 74, bh = 48, gy = yb + bh + 12;
  const lw = 40, rw = W - 40, gap = (rw - lw - N * bw) / (N + 1);
  const bxs = Array.from({ length: N }, (_, i) => lw + gap * (i + 1) + bw * i);
  let f = SV.ground(20, W - 20, gy) + SV.wall(lw, yb - 30, gy, -1);
  if (right) f += moving ? `<rect x="${rw - 6}" y="${yb - 24}" width="10" height="${bh + 30}" fill="var(--hint-bg)" stroke="${INK}" stroke-width="1.6"/>` + SV.arrow(rw - 1, yb - 40, rw + 26, yb - 40, FOR) + SV.sym(rw + 2, yb - 48, "y", null, "start", FOR, "(t)") : SV.wall(rw, yb - 30, gy, 1);
  bxs.forEach((x, i) => { f += SV.box(x, yb, bw, bh, Mid(i + 1)); f += `<circle cx="${x + 16}" cy="${yb + bh + 6}" r="6" fill="var(--panel)" stroke="${INK}" stroke-width="1.4"/><circle cx="${x + bw - 16}" cy="${yb + bh + 6}" r="6" fill="var(--panel)" stroke="${INK}" stroke-width="1.4"/>`; });
  conns.forEach((c) => {
    const xa = c.a === 0 ? lw : bxs[c.a - 1] + bw, xb = c.b === N + 1 ? rw - 6 : bxs[c.b - 1];
    f += SV.spring(xa, yb + 14, xb, yb + 14, INK, 6, 6); f += SV.sym((xa + xb) / 2, yb + 4, "k" + c.id, null, "middle", INK);
    if (c.damp) { f += SV.damper(xa, yb + 36, xb, yb + 36); f += SV.sym((xa + xb) / 2, yb + 62, "c" + c.id, null, "middle", INK); }
  });
  bxs.forEach((x, i) => { const cx = x + bw / 2; f += SV.arrow(cx - 18, yb - 16, cx + 20, yb - 16); f += SV.sym(cx + 24, yb - 11, q(i + 1), null, "start", ACC); });
  { const cx = bxs[fCart - 1] + bw / 2; f += SV.arrow(cx - 26, yb - 54, cx + 22, yb - 54, FOR); f += SV.sym(cx - 30, yb - 49, "F", null, "end", FOR, "(t)"); }

  const items = [];
  items.push(readItem(sent, "coords", "Qual frase diz se as coordenadas são <b>absolutas ou relativas</b>?", rel ? "Relativas: x₂ = x₁ + u₂, x₃ = x₁ + u₂ + u₃… Em T entra a velocidade absoluta, então aparecem somas." : "Absolutas: cada carrinho tem a sua; as molas entre carrinhos sentem diferenças."));
  if (moving) items.push(readItem(sent, "base", "Qual frase diz que uma ponta da última mola <b>se move</b>?", "y(t) é imposto: entra na deformação da mola, não é coordenada."));
  items.push(I.choice("mec", `Cada <b>${CN}</b> é:`, BODY, 3, "Só translada."));
  items.push(I.choice("mec", `Cada ligação elástica (${K.n.spring[1]}) é:`, BODY, 2, "Sem massa: liga dois pontos."));
  if (right) items.push(I.choice("mec", `${nounQ(moving ? K.n.plate : K.n.wallR)} é:`, BODY, moving ? 1 : 0, moving ? "Movimento imposto y(t)." : "Parada."));
  items.push(I.num("Quantos graus de liberdade?", N, "Um por carrinho."));
  items.push(I.match("O que cada coordenada mede?", coords.slice(0, Math.min(3, N)).map((c, i) => [c, rel && i > 0 ? `deslocamento do ${CN} ${i + 1} em relação ao ${CN} ${i}` : `deslocamento absoluto do ${CN} ${i + 1}`]), [rel ? `deslocamento absoluto do ${CN} 2` : `deslocamento do ${CN} 2 em relação ao ${CN} 1`, "deformação da mola k1"], rel ? "u é relativa: diferença entre vizinhos." : "Todas absolutas."));
  if (rel) for (let i = 2; i <= Math.min(N, 3); i++) items.push(I.expr("pos", `x<sub>${i}</sub> =`, `Deslocamento <b>absoluto</b> do ${CN} ${i}.`, X(i), { wrongs: [XW(i)], hint: `Some os deslocamentos relativos desde o ${CN} 1.`, why: `x<sub>${i}</sub> = x<sub>1</sub> + ${Array.from({ length: i - 1 }, (_, k) => "u<sub>" + (k + 2) + "</sub>").join(" + ")}.` }));
  for (let i = 1; i <= N; i++) items.push(I.expr("T", "v² =", `Velocidade ao quadrado do <b>${CN} ${i}</b>.`, `(${X(i, true)})^2`, { wrongs: rel && i > 1 ? [`${XW(i, true)}^2`] : [], sq: true, coef: Mid(i), tlabel: CN + " " + i, hint: "T usa a velocidade absoluta.", why: rel && i > 1 ? "Velocidade absoluta = soma das velocidades relativas até ele: aparece acoplamento em [M]." : "Coordenada absoluta própria." }));
  conns.forEach((c) => items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("k" + c.id)}</b> (${c.a === 0 ? `parede–${CN} 1` : c.b === N + 1 ? (moving ? `${CN} ${N}–placa` : `${CN} ${N}–parede`) : `${CN} ${c.a}–${CN} ${c.b}`}).`, def(c), { wrongs: rel && c.a > 1 && c.b <= N ? [`${q(c.b)} - ${q(c.a)}`] : !rel && c.a > 0 && c.b <= N ? [X(c.b)] : [], mode: "pm", coef: "k" + c.id, hint: "Quanto uma ponta andou − quanto a outra andou.", why: rel && c.a > 0 && c.b <= N ? "Entre vizinhos, a deformação é exatamente a coordenada relativa: [K] fica diagonal." : "Diferença dos deslocamentos absolutos das duas pontas." })));

  coords.forEach((c, k) => { const i = k + 1; const a = rel ? (i <= fCart ? "F" : "0") : (i === fCart ? "F" : "0"); items.push(I.expr("Q", `Q<sub>${i}</sub> =`, `Força generalizada em <b>${sy(c)}</b>.`, a, { hint: "Mexa só essa coordenada: o carrinho da força anda?", why: rel ? (i <= fCart ? "Mexer essa coordenada (com as outras paradas) arrasta o carrinho da força junto." : "Só move carrinhos depois do da força.") : i === fCart ? "δW = F δx." : "Mexer outro carrinho não move o da força." })); });
  {
    const plural = { carrinho: "carrinhos", "vagão": "vagões", andar: "andares" }[K.n.cart[1]];
    const cand = [[`${nounL(K.n.spring)} entre o ponto fixo da esquerda e o ${K.n.cart[1]} 1`, "k1"]];
    for (let i = 1; i < N; i++) cand.push([`${nounL(K.n.spring)} entre os ${plural} ${i} e ${i + 1}`, "k" + (i + 1)]);

    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));

  return genEx("carts", { ctx: K.id, title: K.title, coords, params, names: { yd: ["ẏ", ""] }, sent, figSVG: SV.wrap(W, H, f), figNote: rel ? "u = deslocamento em relação ao carrinho anterior." : "Deslocamentos absolutos a partir do equilíbrio.", items });
}

// Famílias novas do gerador (v5). Mesmo formato das famílias de gerador.js: cada função sorteia
// contexto, geometria e convenções, desenha a figura e calcula o gabarito. Erros típicos vão em `wrongs`.

const DRV = (s) => s.replace(/\b(x|y|h|hG|xA|xB|yb|th\w*|ph\w*)\b/g, "$1d"); // posição → velocidade
const pivot = (x, y, s = 1) => `<path d="M${x},${y} L${x - 11},${y + 18 * s} L${x + 11},${y + 18 * s} Z" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="4" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/>`;
const dot = (x, y, r = 10) => `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--accent-soft)" stroke="${INK}" stroke-width="1.8"/>`;
const cgMark = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/><path d="M${x},${y - 6} A6,6 0 0 1 ${x + 6},${y} L${x},${y} Z M${x},${y + 6} A6,6 0 0 1 ${x - 6},${y} L${x},${y} Z" fill="${INK}"/>`;
function dimV(x, ys, labels) {
  let s = ""; ys.forEach((y) => (s += SV.line(x - 6, y, x + 6, y, MUT, 1)));
  for (let i = 0; i < ys.length - 1; i++) { s += SV.line(x, ys[i], x, ys[i + 1], MUT, 1); s += SV.sym(x + 9, (ys[i] + ys[i + 1]) / 2 + 5, labels[i], null, "start", MUT); }
  return s;
}
// estações numa linha com trechos a, b, c…: distância com sinal de i até j
function stations(n) {
  const segs = Array.from({ length: n - 1 }, (_, i) => "abcdef"[i]);
  const dist = (i, j) => (i === j ? { sg: 0, str: "0" } : { sg: j > i ? 1 : -1, str: segs.slice(Math.min(i, j), Math.max(i, j)).join(" + ") });
  const arm = (i, j) => { const d = dist(i, j); return d.sg === 0 ? "0" : `${d.sg < 0 ? "-" : ""}(${d.str})`; };
  return { segs, dist, arm };
}
const sgnStr = (d) => (d.sg < 0 ? "-" : "+");

  if (tipK) { f += SV.spring(cx + 10, ty, W - 40, ty); f += SV.wall(W - 40, ty - 26, ty + 26, 1); f += SV.sym((cx + W - 40) / 2 + 5, ty - 14, "kL"); }
  if (fOpt === "tip") { f += SV.arrow(cx - 80, ty - 2, cx - 14, ty - 2, FOR); f += SV.sym(cx - 84, ty + 3, "F", null, "end", FOR, "(t)"); }

  const items = [];

  if (tor) items.push(I.expr("V", "Δ =", `Deformação da mola de torção <b>${sy("kt")}</b>.`, "th", { mode: "pm", coef: "kt", hint: "O suporte gira?", why: "O suporte só translada: a rotação relativa é θ." }));
