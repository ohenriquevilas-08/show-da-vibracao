/* =====================================================================
   Família F: eixo vertical rígido em dois mancais, com massas concentradas
   ===================================================================== */
function genShaft() {
  const K = R.pick(SK.shaft);
  const conv = R.flagPick("shaftConv", ["two", "two", "base"]);
  const nD = R.int(1, 3), massive = R.flag("shaftMassive", 0.35);
  let st = [{ key: "A", kind: "brg" }];
  const discs = Array.from({ length: nD }, (_, i) => ({ key: "D" + (i + 1), kind: "disc", i: i + 1 }));
  discs.forEach((d) => st.push(d));
  st.push({ key: "B", kind: "brg" });
  if (R.chance(0.45)) { const d = st.splice(st.length - 2, 1)[0]; st.push(d); } // disco em balanço acima de B
  if (massive) st.splice(R.int(1, st.length - 1), 0, { key: "G", kind: "G" });
  const n = st.length, { segs, dist, arm } = stations(n), idx = Object.fromEntries(st.map((s, i) => [s.key, i]));
  const dA = (k) => arm(idx.A, idx[k]);
  const dampA = R.chance(0.4), dampB = R.chance(0.4);
  const fKey = R.pick(discs).key;
  const Dstr = dist(idx.A, idx.B).str;
  const coords = conv === "two" ? ["xA", "xB"] : ["xA", "th"];
  const derived = conv === "two" ? [["D", Dstr], ["th", "(xB - xA)/D"], ["thd", "(xBd - xAd)/D"]] : [];
  const params = [...discs.map((d) => "m" + d.i), ...segs, "kA", "kB"]; if (dampA) params.push("cA"); if (dampB) params.push("cB"); if (massive) params.push("M", "JG"); params.push("F");
  const pos = (k, vel = false) => { const d = vel ? "d" : ""; if (k === "A") return "xA" + d; if (k === "B" && conv === "two") return "xB" + d; return `xA${d} + ${dA(k)}*th${d}`; };
  const posW = (k, vel = false) => { const d = vel ? "d" : ""; const D = dist(idx.B, idx[k]); return D.sg === 0 ? `xA${d}` : `xA${d} + ${arm(idx.B, idx[k])}*th${d}`; };

  const sent = [];
  sent.push({ tag: "rigid", t: K.intro(massive ? sy("M") : null, massive ? sy("JG") : null) });
  sent.push({ tag: "brg", t: K.brg(sy("kA"), dampA ? sy("cA") : null, sy("kB"), dampB ? sy("cB") : null) });
  sent.push({ tag: "disc", t: K.discs(discs.map((d) => sy("m" + d.i)).join(", ")) });
  sent.push({ tag: "force", t: K.force(fKey.startsWith("D") ? "a massa " + sy("m" + fKey.slice(1)) : "o topo do eixo", sy("F")) });
  sent.push({ tag: "conv", t: `A rotação θ do eixo é pequena e positiva quando o topo se desloca no sentido +x; assim um ponto a uma altura s acima de A se desloca x<sub>A</sub> + s·θ.` });
  sent.push({ tag: "coords", t: conv === "two" ? `Coordenadas: os deslocamentos horizontais ${sy("xA")} e ${sy("xB")} do eixo nos mancais A e B.` : `Coordenadas: o deslocamento horizontal ${sy("xA")} do eixo no mancal A e a rotação θ do eixo.` });
  sent.push({ tag: "equil", t: "Deslocamentos a partir do equilíbrio; despreze a gravidade (o eixo é vertical)." });

  // figura (de baixo para cima)
  const H = 420, W = 520, x0 = 250, ybot = 380, ytop = 50;
  const hs = [0]; segs.forEach(() => hs.push(hs[hs.length - 1] + R.int(50, 100)));
  const sc = (ybot - ytop) / hs[hs.length - 1], Y = hs.map((h) => ybot - h * sc);
  let f = SV.line(x0, Y[0] + 10, x0, Y[n - 1] - 10, INK, 6) + dimV(x0 + 120, Y, segs);
  st.forEach((s, i) => {
    const y = Y[i];
    if (s.kind === "disc") { f += `<rect x="${x0 - 48}" y="${y - 7}" width="96" height="14" rx="3" fill="var(--accent-soft)" stroke="${INK}" stroke-width="1.6"/>`; f += SV.sym(x0 + 56, y + 5, "m" + s.i, null, "start"); }
    if (s.kind === "G") { f += cgMark(x0, y); f += SV.t(x0 + 12, y - 8, "G", "start", MUT, 13); }
    if (s.kind === "brg") {
      const dmp = s.key === "A" ? dampA : dampB;
      f += SV.wall(60, y - 30, y + 30, -1); f += SV.spring(60, y - (dmp ? 10 : 0), x0 - 6, y - (dmp ? 10 : 0), INK, 7, 6); f += SV.sym(120, y - 18, "k" + s.key);
      if (dmp) { f += SV.damper(60, y + 14, x0 - 6, y + 14); f += SV.sym(120, y + 42, "c" + s.key); }
      f += SV.t(x0 + 14, y + 20, s.key, "start", MUT, 13);
    }
  });
  f += SV.arrow(x0 + 10, Y[0] + 26, x0 + 46, Y[0] + 26); f += SV.sym(x0 + 50, Y[0] + 31, "xA", null, "start", ACC);
  if (conv === "two") { f += SV.arrow(x0 + 10, Y[idx.B] - 22, x0 + 46, Y[idx.B] - 22); f += SV.sym(x0 + 50, Y[idx.B] - 17, "xB", null, "start", ACC); }
  else { f += SV.arc(x0, Y[n - 1] - 6, 22, 120, 60); f += SV.t(x0 + 26, Y[n - 1] - 24, "θ", "start", ACC); }
  { const y = Y[idx[fKey]]; f += SV.arrow(x0 - 120, y - 16, x0 - 56, y - 16, FOR); f += SV.sym(x0 - 124, y - 11, "F", null, "end", FOR, "(t)"); }

  const items = [];
  items.push(readItem(sent, "conv", "Qual frase dá a <b>convenção de sinal</b> da rotação?", "θ positivo leva o topo para +x: um ponto acima de A anda x_A + s·θ (s medido para cima a partir de A)."));
  items.push(readItem(sent, "coords", "Qual frase define as <b>coordenadas</b>?", conv === "two" ? "Duas translações nos mancais: θ sai delas, θ = (x_B − x_A)/D." : "Translação em A e rotação: todo ponto é x_A + s·θ."));
  items.push(I.choice("mec", "O <b>eixo</b> é:", BODY, massive ? 4 : 2, massive ? "Corpo rígido com massa: translada e gira." : "Massa desprezível: só leva os discos (mas é rígido, então liga os deslocamentos)."));
  items.push(I.choice("mec", "Cada <b>massa concentrada</b> é:", BODY, 3, "Ponto material preso ao eixo: anda com ele."));
  items.push(I.num("Quantos graus de liberdade?", 2, "Eixo rígido no plano: translação + rotação (os discos não acrescentam coordenadas)."));
  if (conv === "two") items.push(I.expr("pos", "θ =", "Rotação do eixo, só com as coordenadas e cotas.", "(xB - xA)/D", { forbid: ["th", "thd"], wrongs: ["(xA - xB)/D", "(xB + xA)/D"], hint: "Diferença dos deslocamentos de B e A sobre a distância entre eles.", why: `D = ${Dstr}; θ positivo quando o topo vai para +x.` }));
  R.shuffle(st.filter((s) => s.kind === "disc" || (s.key === "B" && conv !== "two")).map((s) => s.key)).slice(0, 2).forEach((k) => items.push(I.expr("pos", `x<sub>${k}</sub> =`, `Deslocamento horizontal ${k.startsWith("D") ? `da massa <b>${sy("m" + k.slice(1))}</b>` : "do eixo no mancal <b>B</b>"}.`, pos(k), { wrongs: [posW(k)], tpl: "shaft-pos", hint: "x_A + (altura acima de A, com sinal) × θ.", why: `Altura de ${k} acima de A = ${dA(k)}; abaixo de A ela é negativa.` })));
  discs.forEach((d) => items.push(I.expr("T", "v² =", `Velocidade ao quadrado da <b>massa ${sy("m" + d.i)}</b>.`, `(${pos(d.key, true)})^2`, { wrongs: [`(${posW(d.key, true)})^2`], sq: true, coef: "m" + d.i, tlabel: "massa " + d.i, hint: "Derive a posição horizontal da massa.", why: "Ponto do eixo: ẋ_A + s·θ̇." })));
  if (massive) { items.push(I.expr("T", "v<sub>G</sub>² =", "Velocidade ao quadrado do <b>CG do eixo</b>.", `(${pos("G", true)})^2`, { wrongs: [`(${posW("G", true)})^2`], sq: true, coef: "M", tlabel: "eixo (translação)", hint: "Derive a posição de G.", why: "G é um ponto do eixo." })); items.push(I.expr("T", "ω² =", "Velocidade angular ao quadrado do <b>eixo</b>.", conv === "two" ? "((xBd - xAd)/D)^2" : "thd^2", { sq: true, coef: "JG", tlabel: "eixo (rotação)", forbid: conv === "two" ? ["th", "thd"] : undefined, hint: "Derive θ.", why: "ω = θ̇." })); }
  items.push(I.expr("V", "Δ =", `Deformação da mola do mancal <b>A</b> (${sy("kA")}).`, "xA", { mode: "pm", coef: "kA", hint: "Parede parada.", why: "x_A − 0." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola do mancal <b>B</b> (${sy("kB")}).`, pos("B"), { mode: "pm", wrongs: conv === "two" ? ["xB - xA"] : [`xA - (${Dstr})*th`, "xA"], coef: "kB", hint: "Deslocamento do eixo em B, parede parada.", why: conv === "two" ? "x_B é coordenada." : `x_B = x_A + (${Dstr})θ.` }));
  if (dampA) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("cA")}</b>.`, "xAd", { mode: "pm", coef: "cA", hint: "Em paralelo com k_A.", why: "ẋ_A." }));
  if (dampB) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("cB")}</b>.`, pos("B", true), { mode: "pm", coef: "cB", hint: "Em paralelo com k_B.", why: "Derivada da deformação de k_B." }));
  const sF = dA(fKey);
  if (conv === "two") {
    items.push(I.expr("Q", "Q<sub>x<sub>A</sub></sub> =", `Força generalizada em <b>${sy("xA")}</b>.`, `F*(D - ${par(sF)})/D`, { wrongs: [`F*${par(sF)}/D`, "F"], hint: "Mexa só x_A (B parado): o eixo gira em torno de B. Quanto o ponto da força anda?", why: "Com B parado, o ponto à altura s anda (D − s)/D · δx_A." }));
    items.push(I.expr("Q", "Q<sub>x<sub>B</sub></sub> =", `Força generalizada em <b>${sy("xB")}</b>.`, `F*${par(sF)}/D`, { wrongs: [`F*(D - ${par(sF)})/D`, "F"], hint: "Mexa só x_B (A parado).", why: "Com A parado, o ponto à altura s anda s/D · δx_B." }));
  } else {
    items.push(I.expr("Q", "Q<sub>x<sub>A</sub></sub> =", `Força generalizada em <b>${sy("xA")}</b>.`, "F", { wrongs: [`${sF}*F`], hint: "Mexa só x_A: o eixo inteiro translada.", why: "Q = F." }));
    items.push(I.expr("Q", "Q<sub>θ</sub> =", "Força generalizada em <b>θ</b>.", `${sF}*F`, { wrongs: [`${arm(idx.B, idx[fKey])}*F`, "F"], hint: "Mexa só θ (A parado): quanto sobe o braço até a força?", why: `O ponto da força anda (altura acima de A)·δθ = ${sF}·δθ.` }));
  }
  {
    const cand = [["a rigidez do mancal inferior", "kA"], ["a rigidez do mancal superior", "kB"]];
    discs.forEach((d) => cand.push([`a ${K.n.disc} ${d.i}`, "m" + d.i]));
    const pool = params.filter((p) => !segs.includes(p) && p !== "F");
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("shaft", { ctx: K.id, title: K.title, coords, params, derived, thRule: conv === "two" ? "Com θ = (x_B − x_A)/D, um ponto à altura s acima de A anda x_A + s·θ (negativo abaixo de A)." : null, sent, figSVG: SV.wrap(W, H, f, 0), figNote: `De baixo para cima: ${st.map((s) => s.key).join(", ")}. θ positivo leva o topo para +x.`, items });
}

/* =====================================================================
   Família G: dois pêndulos acoplados por mola
   ===================================================================== */
function genCoupled() {
  const K = R.pick(SK.coupled);
  const up = K.up === undefined ? R.flag("cupUp", 0.3) : K.up;
  const bar = R.flag("cupBar", 0.3), rel = R.flag("cupRel", 0.3), eq = R.chance(0.5);
  const kt = up || R.chance(0.3), damp = R.chance(0.35), fP = R.int(1, 2);
  const L = (i) => (eq ? "l" : "l" + i), Mm = (i) => (bar ? (eq ? "M" : "M" + i) : eq ? "m" : "m" + i), J = (i) => (eq ? "JO" : "JO" + i);
  const coords = rel ? ["th1", "ph"] : ["th1", "th2"];
  const A2 = (vel = false) => (rel ? `(th1${vel ? "d" : ""} + ph${vel ? "d" : ""})` : "th2" + (vel ? "d" : ""));
  const A = (i, vel) => (i === 1 ? "th1" + (vel ? "d" : "") : A2(vel));
  const sgn = up ? -1 : 1, S = up ? "-" : "";
  const params = [...new Set([Mm(1), Mm(2), L(1), L(2)])]; if (bar) params.push(...new Set([J(1), J(2)])); params.push("a", "k"); if (damp) params.push("c"); if (kt) params.push("kt"); params.push("g", "F");
  const dk = rel ? "a*ph" : "a*(th2 - th1)", dkW = rel ? ["a*(ph - th1)", "a*ph + a*th1"] : [`${L(1)}*(th2 - th1)`, "a*(th2 + th1)"];
  const dir = up ? "para cima" : "para baixo";

  const sent = [];
  sent.push({ tag: "rods", t: K.intro(up, bar, eq ? `${sy(Mm(1))} e comprimento ${sy(L(1))}` : `${sy(Mm(1))}, ${sy(Mm(2))} e comprimentos ${sy(L(1))}, ${sy(L(2))}`, bar ? (eq ? sy(J(1)) : `${sy(J(1))}, ${sy(J(2))}`) : null) });
  sent.push({ tag: "spring", t: K.spring(sy("k"), sy("a"), damp ? sy("c") : null, up) });
  if (kt) sent.push({ tag: "kt", t: `Cada articulação tem uma mola de torção ${sy("kt")} ligada ao ${up ? "chão" : "suporte"} fixo.` });
  sent.push({ tag: "force", t: K.force(fP, sy("F")) });
  sent.push({ tag: "coords", t: rel ? `Coordenadas: θ<sub>1</sub>, ângulo ${K.n.one} 1 com a vertical, e φ, ângulo ${K.n.one} 2 <b>em relação ${K.n.one.replace("do", "ao").replace("da", "à")} 1</b> (anti-horário positivo).` : `Coordenadas: θ<sub>1</sub> e θ<sub>2</sub>, os ângulos de cada ${K.n.word} com a vertical (anti-horário positivo).` });
  sent.push({ tag: "grav", t: `Considere a gravidade ${sy("g")} e ângulos pequenos.` });

  // figura
  const W = 560, H = 380, X = [170, 390], Lp = 190, yp = up ? 330 : 50, dirY = up ? -1 : 1, ya = yp + dirY * 110;
  let f = up ? SV.ground(60, 500, yp + 14) : SV.line(60, yp - 8, 500, yp - 8, INK, 2) + Array.from({ length: 36 }, (_, i) => SV.line(66 + i * 12, yp - 8, 60 + i * 12, yp - 16, MUT, 1)).join("");
  X.forEach((x, k) => {
    const i = k + 1, yt = yp + dirY * Lp;
    f += up ? pivot(x, yp - 4) : `<circle cx="${x}" cy="${yp}" r="4" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/>` + SV.line(x, yp - 8, x, yp - 4, INK, 2);
    f += bar ? `<line x1="${x}" y1="${yp}" x2="${x}" y2="${yt}" stroke="${INK}" stroke-width="9" stroke-linecap="round" opacity=".55"/>` : SV.line(x, yp, x, yt, INK, 3) + dot(x, yt);
    f += SV.sym(x + 16, yt + 5, Mm(i), null, "start");
    if (kt) f += SV.coil(x - 16, yp + (up ? -12 : 4));
    f += SV.line(x, yp, x, yp + dirY * 70, MUT, 1, "4 4");
    if (!rel || i === 1) { f += SV.arc(x, yp, 46, up ? 90 : -90, up ? 112 : -68); f += SV.sym(x + (up ? -30 : 30), yp + dirY * 40, i === 1 ? "th1" : "th2", null, "middle", ACC); }
    else { f += SV.arc(x, yp, 46, up ? 90 : -90, up ? 112 : -68); f += SV.sym(x + 30, yp + dirY * 40, "ph", null, "middle", ACC); }
    if (!eq || i === 1) f += SV.sym(x - 12, yp + dirY * 150, L(i), null, "end", MUT);
    if (i === fP) { f += SV.arrow(x - 70, yt, x - 14, yt, FOR); f += SV.sym(x - 74, yt + 5, "F", null, "end", FOR, "(t)"); }
  });
  f += SV.spring(X[0], ya, X[1], ya, INK, 9, 6); f += SV.sym(280, ya - 12, "k");
  if (damp) { const yc = ya + dirY * 26; f += SV.damper(X[0], yc, X[1], yc); f += SV.sym(280, yc + 30 * dirY, "c"); }
  f += dimV(X[0] - 40, up ? [ya, yp] : [yp, ya], ["a"]);
  const yg = up ? 130 : 40; f += SV.arrow(520, yg, 520, yg + 40, MUT); f += SV.sym(530, yg + 26, "g", null, "start", MUT);

  const items = [];
  items.push(readItem(sent, "coords", "Qual frase diz <b>como os ângulos são medidos</b>?", rel ? "φ é relativo: o ângulo absoluto do 2 é θ₁ + φ. A mola sente só φ." : "Absolutos: a mola sente a diferença θ₂ − θ₁."));
  items.push(readItem(sent, "spring", "Qual frase diz <b>onde</b> a mola de ligação está presa?", "A mola está à distância a do pino: o braço da mola é a, não o comprimento do pêndulo."));
  items.push(I.choice("mec", `Cada <b>${K.n.word}</b> é:`, BODY, 5, "O pino é fixo: cada um só gira em torno dele."));
  items.push(I.choice("T", `Em T, cada ${K.n.word} entra com:`, TKIND, bar ? 2 : 1, bar ? "Pino fixo: ½ J_O θ̇² basta (a translação do CG já está em J_O, por Steiner)." : "Massa pontual: ½ m v², com v = l·θ̇."));
  items.push(I.num("Quantos graus de liberdade?", 2, "Um ângulo por pêndulo; a mola não tem massa."));
  items.push(I.expr("pos", "x =", `Deslocamento horizontal ${bar ? "do CG" : "da ponta"} ${K.n.one} <b>2</b>.`, `${S}${bar ? `(${L(2)}/2)` : L(2)}*${A2()}`, { wrongs: rel ? [`${S}${bar ? `(${L(2)}/2)` : L(2)}*ph`] : [`${S}${bar ? `(${L(2)}/2)` : L(2)}*(th2 - th1)`], hint: `Braço × ângulo absoluto. ${up ? "Para cima, anti-horário leva para −x." : "Pendurado, anti-horário leva para +x."}`, why: rel ? "Ângulo absoluto do 2 = θ₁ + φ." : "Ângulo absoluto θ₂." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola de ligação <b>${sy("k")}</b>.`, dk, { mode: "pm", wrongs: dkW, coef: "k", hint: "Diferença dos deslocamentos horizontais dos dois pontos de fixação (braço a).", why: rel ? "a(θ₁ + φ) − aθ₁ = aφ." : "a·θ₂ − a·θ₁." }));
  for (let i = 1; i <= 2; i++) {
    if (bar) items.push(I.expr("T", "ω² =", `Velocidade angular ao quadrado ${K.n.one} <b>${i}</b>.`, `${A(i, true)}^2`, { wrongs: rel && i === 2 ? ["phd^2"] : [], sq: true, coef: J(i), tlabel: `${K.n.word} ${i}`, hint: "Derivada do ângulo absoluto.", why: i === 2 && rel ? "ω₂ = θ̇₁ + φ̇." : "ω = θ̇." }));
    else items.push(I.expr("T", "v² =", `Velocidade ao quadrado da massa <b>${sy(Mm(i))}</b>${eq ? ` (${i})` : ""}.`, `(${L(i)}*${A(i, true)})^2`, { wrongs: rel && i === 2 ? [`(${L(2)}*phd)^2`] : [`(${L(i)}*${A(i, true)})^2/2`], sq: true, coef: Mm(i), tlabel: "massa " + i, hint: "Pino fixo: v = l·(velocidade angular absoluta).", why: i === 2 && rel ? "v = l₂(θ̇₁ + φ̇)." : "v = l·θ̇." }));
    const den = bar ? 4 : 2;
    items.push(I.expr("V", "V<sub>g</sub> =", `Gravidade ${K.n.one} <b>${i}</b> (termo inteiro).`, `${S}${Mm(i)}*g*${L(i)}*${A(i)}^2/${den}`, { kind: "term", wrongs: [`${up ? "" : "-"}${Mm(i)}*g*${L(i)}*${A(i)}^2/${den}`, `${S}${Mm(i)}*g*${L(i)}*${A(i)}^2/${den / 2}`], hint: `${up ? "Em pé, a massa desce ao girar." : "Pendurada, a massa sobe ao girar."} Braço ${bar ? "l/2" : "l"}.`, why: `${up ? "−" : "+"}½ m g ${bar ? "(l/2)" : "l"} (ângulo absoluto)².` }));
    if (kt) items.push(I.expr("V", "Δ =", `Deformação da mola de torção da articulação <b>${i}</b>.`, A(i), { mode: "pm", wrongs: rel && i === 2 ? ["ph"] : [], coef: "kt", hint: "A base é fixa: rotação absoluta.", why: i === 2 && rel ? "Base fixa: sente θ₁ + φ." : "θ − 0." }));
  }
  if (damp) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("c")}</b>.`, DRV(dk), { mode: "pm", coef: "c", hint: "Em paralelo com a mola k.", why: "Derivada da deformação de k." }));
  const lf = bar ? L(fP) : L(fP);
  const q1 = fP === 1 || rel ? `${S}${lf}*F` : "0", q2 = fP === 2 ? `${S}${lf}*F` : "0";
  items.push(I.expr("Q", "Q<sub>θ<sub>1</sub></sub> =", "Força generalizada em <b>θ<sub>1</sub></b>.", q1, { wrongs: [q1 === "0" ? `${S}${lf}*F` : "0", `${up ? "" : "-"}${lf}*F`], hint: `Mexa só θ₁${rel ? " (φ parado: o 2 gira junto!)" : ""}: a ponta da força anda?`, why: rel && fP === 2 ? "Com φ parado, girar θ₁ gira o pêndulo 2 junto: a ponta dele anda l₂δθ₁." : fP === 1 ? "A ponta anda l·δθ na horizontal." : "Mexer o pêndulo 1 não move o 2." }));
  items.push(I.expr("Q", `Q<sub>${rel ? "φ" : "θ<sub>2</sub>"}</sub> =`, `Força generalizada em <b>${sy(coords[1])}</b>.`, q2, { wrongs: [q2 === "0" ? `${S}${L(1)}*F` : "0", `${up ? "" : "-"}${lf}*F`], hint: "Mexa só essa coordenada: a ponta da força anda?", why: fP === 2 ? "A ponta do 2 anda l₂·δ na horizontal." : "O pêndulo 1 não se move." }));
  {
    const cand = [["a mola que liga os dois", "k"], ["a altura (distância ao pino) da ligação", "a"]];
    if (!eq) cand.push([`a massa ${K.n.one} 1`, Mm(1)], [`a massa ${K.n.one} 2`, Mm(2)]);
    const pool = params.filter((p) => !["g", "F"].includes(p));
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("coupled", { ctx: K.id, title: K.title, coords, params, names: { ph: ["φ", ""] }, sent, figSVG: SV.wrap(W, 250, f, up ? 115 : 20), figNote: `Desenho no equilíbrio, ${dir}. Ângulos anti-horários positivos.`, items });
}

/* =====================================================================
   Família H: alavanca com pino fixo (só gira), massas, molas e bloco
   ===================================================================== */
function genLever() {
  const K = R.pick(SK.lever);
  const nS = R.int(3, 5);
  const st = Array.from({ length: nS }, () => ({ kind: "pt" }));
  const iO = R.int(0, nS - 1); st[iO] = { kind: "O" };
  const free = st.map((s, i) => i).filter((i) => i !== iO);
  const keys = "PQRSTU".split(""); free.forEach((i, k) => (st[i].key = keys[k])); st[iO].key = "O";
  const jG = R.flag("leverJG", 0.4);
  if (jG) { const g = R.pick(free); st[g].G = true; }
  const nK = R.int(1, 2), kAt = R.shuffle(free).slice(0, nK);
  kAt.forEach((i, k) => (st[i].k = "k" + (k + 1)));
  const mAt = R.shuffle(free).slice(0, R.int(0, 2)); mAt.forEach((i, k) => (st[i].m = "m" + (k + 1)));
  const block = R.flag("leverBlock", 0.5), bAt = block ? R.pick(free) : null;
  const fOnBlock = block && R.chance(0.3), fAt = R.pick(free);
  const { segs, dist, arm } = stations(nS);
  const s = (i) => arm(iO, i);
  const sW = (i) => arm(0, i); // erro típico: braço medido da ponta esquerda
  const coords = block ? ["th", "yb"] : ["th"];
  const params = [...segs, jG ? "JG" : "JO"]; if (jG) params.push("M");
  st.forEach((x) => { if (x.k) params.push(x.k); if (x.m) params.push(x.m); });
  if (block) params.push("mb", "kb", "kg"); params.push("F");
  const gI = st.findIndex((x) => x.G), dG = jG ? dist(iO, gI).str : "";

  const sent = [];
  sent.push({ tag: "lever", t: K.intro(st.map((x) => x.key).join(", "), jG ? `massa ${sy("M")} e momento de inércia ${sy("JG")} em relação ao seu centro de massa, que fica no ponto ${st[gI].key}` : `momento de inércia ${sy("JO")} em relação ao pino`) });
  st.forEach((x) => { if (x.k) sent.push({ tag: "spring", t: K.spring(x.key, sy(x.k)) }); if (x.m) sent.push({ tag: "mass", t: K.mass(x.key, sy(x.m)) }); });
  if (block) sent.push({ tag: "block", t: K.block(st[bAt].key, sy("kb"), sy("mb"), sy("kg")) });
  sent.push({ tag: "force", t: fOnBlock ? `Uma força vertical ${sy("F")}(t), para cima, atua ${K.n.block[0] === "a" ? "na" : "no"} ${K.n.block[1]}.` : `Uma força vertical ${sy("F")}(t), para cima, atua no ponto ${st[fAt].key}.` });
  sent.push({ tag: "coords", t: `Coordenadas: a rotação θ da ${K.n.bar} (anti-horária positiva)${block ? ` e o deslocamento vertical ${sy("yb")} ${K.n.block[0] === "a" ? "da" : "do"} ${K.n.block[1]}, para cima` : ""}, a partir do equilíbrio horizontal. Rotações pequenas.` });

  // figura
  const W = 620, H = 380, yb = 150;
  const px = [0]; segs.forEach(() => px.push(px[px.length - 1] + R.int(60, 110)));
  const sc = (W - 160) / px[px.length - 1], X = px.map((p) => 80 + p * sc), gy = 330;
  let f = SV.dim(X, 50, segs);
  f += `<rect x="${X[0] - 16}" y="${yb - 7}" width="${X[nS - 1] - X[0] + 32}" height="14" rx="3" fill="var(--panel)" stroke="${INK}" stroke-width="2"/>`;
  f += SV.ground(40, W - 30, gy);
  st.forEach((x, i) => {
    const xx = X[i];
    if (x.kind === "O") { f += pivot(xx, yb, 1); f += SV.line(xx - 14, yb + 18, xx + 14, yb + 18, INK, 2); f += SV.line(xx, yb + 18, xx, gy, MUT, 1, "3 5"); }
    if (x.G) f += cgMark(xx, yb);
    f += SV.t(xx, yb - 16, x.key, "middle", MUT, 13);
    if (x.m) { f += SV.box(xx - 15, yb - 64, 30, 24, null); f += SV.sym(xx, yb - 47, x.m); }
    if (x.k) { f += SV.spring(xx, yb + 7, xx, gy, INK, 8); f += SV.sym(xx - 14, (yb + gy) / 2, x.k, null, "end"); }
  });
  if (block) { const xx = X[bAt] + (st[bAt].k ? 26 : 0), by = 240; f += SV.spring(xx, yb + 7, xx, by, INK, 5); f += SV.sym(xx + 12, 195, "kb", null, "start"); f += SV.box(xx - 22, by, 44, 26, "mb"); f += SV.spring(xx, by + 26, xx, gy, INK, 4); f += SV.sym(xx + 12, 305, "kg", null, "start"); f += SV.arrow(xx + 34, by + 22, xx + 34, by - 2); f += SV.sym(xx + 40, by + 12, "yb", null, "start", ACC); if (fOnBlock) { f += SV.arrow(xx - 36, by + 30, xx - 36, by - 6, FOR); f += SV.sym(xx - 42, by + 16, "F", null, "end", FOR, "(t)"); } }
  if (!fOnBlock) { const xf = X[fAt] - 18; f += SV.arrow(xf, yb + 62, xf, yb + 10, FOR); f += SV.sym(xf - 6, yb + 50, "F", null, "end", FOR, "(t)"); }
  { const xo = X[iO]; f += SV.arc(xo, yb, 30, 20, 70); f += SV.t(xo + 18, yb - 32, "θ", "start", ACC); }

  const items = [];
  items.push(readItem(sent, "lever", "Qual frase diz que a barra <b>só gira</b>?", "Pino fixo: o ponto O não anda. Todo ponto da barra sobe (distância com sinal a O)·θ."));
  items.push(I.choice("mec", `${nounQ(["a", K.n.bar])} é:`, BODY, 5, "Pino fixo em O: só rotação. Não há translação para acrescentar."));
  if (block) items.push(I.choice("mec", `${nounQ(K.n.block)} é:`, BODY, 3, "Anda na vertical entre duas molas: coordenada própria."));
  items.push(I.num("Quantos graus de liberdade?", coords.length, block ? "θ da barra + y do bloco. O pino fixo tira a translação da barra." : "Só θ: com pino fixo a barra não translada (armadilha comum: contar 2)."));
  R.shuffle(free).slice(0, 2).forEach((i) => items.push(I.expr("pos", `y<sub>${st[i].key}</sub> =`, `Deslocamento vertical do ponto <b>${st[i].key}</b> da ${K.n.bar}.`, `${s(i)}*th`, { wrongs: [`${sW(i) === "0" ? arm(nS - 1, i) : sW(i)}*th`], tpl: "lever-pos", hint: "Distância com sinal até o pino O × θ. À direita de O, +.", why: `O não anda: y = (distância de O a ${st[i].key})·θ = ${s(i)}·θ.` })));
  if (jG) items.push(I.expr("T", "J<sub>O</sub> =", "Momento de inércia da barra em relação ao <b>pino O</b>.", `JG + M*(${dG})^2`, { wrongs: ["JG", `JG - M*(${dG})^2`, `JG + M*(${dG})`], hint: "Steiner: J_O = J_G + M·(distância de G a O)².", why: `G está a ${dG} do pino. Com pino fixo, T = ½ J_O θ̇².` }));
  items.push(I.choice("T", `Em T, a <b>${K.n.bar}</b> entra com:`, TKIND, 2, "Pino fixo: ½ J_O θ̇² (a translação do CG já está em J_O)."));
  st.forEach((x, i) => { if (x.m) items.push(I.expr("T", "v² =", `Velocidade ao quadrado da massa <b>${sy(x.m)}</b> (ponto ${x.key}).`, `(${s(i)}*thd)^2`, { wrongs: [`(${sW(i) === "0" ? arm(nS - 1, i) : sW(i)}*thd)^2`], sq: true, coef: x.m, tlabel: "massa no ponto " + x.key, hint: "Braço até O × θ̇.", why: "Ponto da barra: v = s·θ̇." })); });
  if (block) items.push(I.expr("T", "v² =", `Velocidade ao quadrado ${K.n.block[0] === "a" ? "da" : "do"} <b>${K.n.block[1]}</b>.`, "ybd^2", { sq: true, coef: "mb", tlabel: K.n.block[1], hint: "Coordenada própria.", why: "ẏ_b." }));
  items.push(I.expr("T", "ω² =", `Velocidade angular ao quadrado da <b>${K.n.bar}</b>.`, "thd^2", { sq: true, coef: jG ? undefined : "JO", coefHTML: jG ? `(J<sub>G</sub> + M·(${dG.replace(/ /g, "")})²)` : undefined, coefExpr: jG ? `JG + M*(${dG})^2` : undefined, tlabel: K.n.bar, hint: "Derivada de θ.", why: "ω = θ̇." }));
  st.forEach((x, i) => { if (x.k) items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy(x.k)}</b> (ponto ${x.key} até o chão).`, `${s(i)}*th`, { mode: "pm", wrongs: [`${sW(i) === "0" ? arm(nS - 1, i) : sW(i)}*th`], coef: x.k, hint: "Deslocamento do ponto − chão parado.", why: `y_${x.key} = ${s(i)}·θ.` })); });
  if (block) { items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("kb")}</b> (ponto ${st[bAt].key} até ${K.n.block[0] === "a" ? "a" : "o"} ${K.n.block[1]}).`, `yb - ${s(bAt)}*th`, { mode: "pm", wrongs: [`yb + ${s(bAt)}*th`, `yb - ${sW(bAt) === "0" ? arm(nS - 1, bAt) : sW(bAt)}*th`], coef: "kb", hint: "Ponta de baixo − ponta de cima.", why: `y_b − y_${st[bAt].key}, com y_${st[bAt].key} = ${s(bAt)}·θ.` })); items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("kg")}</b> (até o chão).`, "yb", { mode: "pm", coef: "kg", hint: "Chão parado.", why: "y_b − 0." })); }
  const qth = fOnBlock ? "0" : `${s(fAt)}*F`;
  items.push(I.expr("Q", "Q<sub>θ</sub> =", "Força generalizada em <b>θ</b>.", qth, { wrongs: fOnBlock ? ["F", `${s(bAt)}*F`] : [`${sW(fAt) === "0" ? arm(nS - 1, fAt) : sW(fAt)}*F`, "F"], hint: "Mexa só θ: quanto o ponto da força sobe?", why: fOnBlock ? "Girar a barra (com y_b parado) não move o bloco: Q_θ = 0." : `O ponto ${st[fAt].key} sobe ${s(fAt)}·δθ.` }));
  if (block) items.push(I.expr("Q", "Q<sub>y<sub>b</sub></sub> =", `Força generalizada em <b>${sy("yb")}</b>.`, fOnBlock ? "F" : "0", { wrongs: [fOnBlock ? "0" : "F"], hint: "Mexa só y_b.", why: fOnBlock ? "δW = F δy_b." : "Mexer o bloco não move o ponto da força." }));
  {
    const cand = [];
    st.forEach((x) => { if (x.k) cand.push([`a mola presa no ponto ${x.key}`, x.k]); if (x.m) cand.push([`a massa presa no ponto ${x.key}`, x.m]); });
    if (block) cand.push([nounL(K.n.block), "mb"], [`a ligação entre a ${K.n.bar} e ${nounL(K.n.block)}`, "kb"]);
    const pool = params.filter((p) => !segs.includes(p) && p !== "F");
    if (pool.length >= 4) R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("lever", { ctx: K.id, title: K.title, coords, params, names: { yb: ["y", "b"] }, sent, figSVG: SV.wrap(W, H, f, 10), figNote: `Da esquerda para a direita: ${st.map((x) => x.key).join(", ")}. Pino fixo em O.`, items });
}

/* =====================================================================
   Família I: seção típica de aerofólio (h, θ)
   ===================================================================== */
function genAirfoil() {
  const K = R.pick(SK.foil);
  const conv = R.flagPick("foilConv", ["ea", "ea", "cg"]), behind = R.flag("foilBehind", 0.75), damp = R.chance(0.4);
  const sg = behind ? 1 : -1, se = behind ? "+" : "-";
  const h = conv === "ea" ? "h" : "hG";
  const coords = [h, "th"];
  const params = ["m", "JG", "kh", "kt", "e", "d"]; if (damp) params.push("ch"); params.push("L");
  // deslocamento vertical (para baixo) de cada ponto
  const wEA = conv === "ea" ? "h" : `hG ${behind ? "-" : "+"} e*th`;
  const wG = conv === "ea" ? `h ${se} e*th` : "hG";
  const acArm = conv === "ea" ? "d" : behind ? "(d + e)" : "(d - e)";
  const wAC = `${h} - ${acArm}*th`;

  const sent = [];
  sent.push({ tag: "sec", t: K.intro(sy("m"), sy("JG")) });
  sent.push({ tag: "ea", t: K.springs(sy("kh"), sy("kt"), damp ? sy("ch") : null) });
  sent.push({ tag: "cg", t: `O centro de massa G fica a uma distância ${sy("e")} ${behind ? "atrás" : "à frente"} do eixo elástico E.` });
  sent.push({ tag: "ac", t: `${K.liftTxt(sy("L"))} no centro aerodinâmico, a uma distância ${sy("d")} à frente de E.` });
  sent.push({ tag: "sign", t: `${conv === "ea" ? `${sy("h")} é o deslocamento vertical do eixo elástico E` : `${sy("hG")} é o deslocamento vertical do centro de massa G`}, <b>positivo para baixo</b>, e θ é a rotação, <b>positiva com ${K.n.nose} subindo</b>.` });
  sent.push({ tag: "small", t: "Deslocamentos a partir do equilíbrio, rotações pequenas." });

  // figura: bordo de ataque à esquerda
  const W = 600, H = 300, y0 = 130, xLE = 90, xTE = 520, xE = 270, px = 70;
  const xG = xE + sg * px, xAC = xE - 90;
  let f = `<path d="M${xLE},${y0} C${xLE + 20},${y0 - 34} ${xLE + 140},${y0 - 40} ${xTE},${y0 - 4} L${xTE},${y0 + 2} C${xLE + 140},${y0 + 22} ${xLE + 20},${y0 + 22} ${xLE},${y0} Z" fill="var(--accent-soft)" stroke="${INK}" stroke-width="2"/>`;
  f += `<circle cx="${xE}" cy="${y0}" r="7" fill="var(--panel)" stroke="${INK}" stroke-width="1.8"/>` + SV.line(xE - 5, y0 - 5, xE + 5, y0 + 5, INK, 1.4) + SV.line(xE - 5, y0 + 5, xE + 5, y0 - 5, INK, 1.4);
  f += SV.t(xE + 2, y0 - 16, "E", "middle", MUT, 13); f += cgMark(xG, y0 + 2); f += SV.t(xG, y0 - 16, "G", "middle", MUT, 13);
  f += `<path d="M${xAC},${y0 - 6} L${xAC - 6},${y0 + 5} L${xAC + 6},${y0 + 5} Z" fill="${FOR}"/>`; f += SV.t(xAC, y0 + 22, "CA", "middle", MUT, 12);
  f += SV.spring(xE, y0 + 8, xE, 262, INK, 7); f += SV.ground(xE - 40, xE + 40, 262); f += SV.sym(xE + 14, 220, "kh", null, "start");
  if (damp) { f += SV.damper(xE + 50, y0 + 8, xE + 50, 262); f += SV.sym(xE + 66, 250, "ch", null, "start"); }
  f += SV.coil(xE - 22, y0 + 18); f += SV.sym(xE - 30, y0 + 46, "kt", null, "end");
  f += SV.arrow(xAC, y0 - 10, xAC, y0 - 70, FOR); f += SV.sym(xAC - 8, y0 - 54, "L", null, "end", FOR, "(t)");
  const xh = conv === "ea" ? xE : xG; f += SV.arrow(xh + 26, y0 - 52, xh + 26, y0 - 18); f += SV.sym(xh + 32, y0 - 34, h, null, "start", ACC);
  f += SV.arc(xLE + 10, y0, 40, 160, 200); f += SV.arrow(xLE + 10 - 37.6, y0 - 13.7, xLE + 10 - 36, y0 - 20); f += SV.t(xLE - 40, y0 - 22, "θ", "end", ACC);
  f += SV.dim([xAC, xE], 24, ["d"]); f += SV.dim(behind ? [xE, xG] : [xG, xE], 52, ["e"]);

  const items = [];
  items.push(readItem(sent, "sign", "Qual frase define os <b>sentidos positivos</b>?", "h para baixo e θ com o nariz para cima: um ponto à distância s atrás de E desce h + s·θ; um ponto à frente desce h − s·θ."));
  items.push(readItem(sent, "cg", "Qual frase diz que <b>G não coincide com E</b> (acoplamento inercial)?", "Com G fora de E, a velocidade de G mistura ḣ e θ̇: acoplamento em [M]."));
  items.push(I.choice("mec", `${nounQ(K.n.sec)} é:`, BODY, 4, "Sobe/desce e gira: translação + rotação."));
  items.push(I.num("Quantos graus de liberdade?", 2, "h e θ."));
  items.push(I.match("O que cada coordenada mede?", [[h, `deslocamento vertical ${conv === "ea" ? "do eixo elástico E" : "do centro de massa G"}, para baixo`], ["th", `rotação, positiva com ${K.n.nose} subindo`]], [`deslocamento vertical ${conv === "ea" ? "do eixo elástico E" : "do centro de massa G"}, para cima`, `rotação, positiva com ${K.n.nose} descendo`], "Repare no sentido positivo de cada uma."));
  if (conv === "ea") items.push(I.expr("pos", "w<sub>G</sub> =", "Deslocamento vertical (para baixo) do <b>centro de massa G</b>.", wG, { wrongs: [`h ${behind ? "-" : "+"} e*th`, `h ${se} d*th`], hint: "Com o nariz subindo, o que está atrás de E desce.", why: `G está ${behind ? "atrás" : "à frente"} de E: ${behind ? "desce" : "sobe"} e·θ.` }));
  else items.push(I.expr("pos", "w<sub>E</sub> =", "Deslocamento vertical (para baixo) do <b>eixo elástico E</b>.", wEA, { wrongs: [`hG ${behind ? "+" : "-"} e*th`], hint: "E está do outro lado de G.", why: `E está ${behind ? "à frente" : "atrás"} de G.` }));
  items.push(I.expr("pos", "w<sub>CA</sub> =", "Deslocamento vertical (para baixo) do <b>centro aerodinâmico</b>.", wAC, { wrongs: [`${h} + ${acArm}*th`, conv === "ea" ? `h - e*th` : "hG - d*th"], tpl: "foil-ac", hint: "O CA está à frente: com o nariz subindo, ele sobe (desce negativo).", why: `Distância de ${conv === "ea" ? "E" : "G"} ao CA = ${acArm}, à frente.` }));
  items.push(I.expr("T", "v<sub>G</sub>² =", "Velocidade ao quadrado do <b>centro de massa G</b>.", `(${DRV(wG)})^2`, { wrongs: conv === "ea" ? [`hd^2 + e^2*thd^2`, `(hd ${se} d*thd)^2`] : [], sq: true, coef: "m", tlabel: "seção (translação)", hint: "Derive a posição de G.", why: conv === "ea" ? "ḣ e e·θ̇ estão na mesma direção (vertical): termo cruzado m·e·ḣθ̇ (acoplamento inercial)." : "G é a coordenada." }));
  items.push(I.expr("T", "ω² =", `Velocidade angular ao quadrado ${K.n.sec[0] === "a" ? "da" : "do"} <b>${K.n.sec[1]}</b>.`, "thd^2", { sq: true, coef: "JG", tlabel: "seção (rotação)", hint: "Derive θ.", why: "ω = θ̇." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola de flexão <b>${sy("kh")}</b> (presa em E).`, wEA, { mode: "pm", wrongs: conv === "ea" ? [] : ["hG", `hG ${behind ? "+" : "-"} e*th`], coef: "kh", hint: "Deslocamento de E.", why: conv === "ea" ? "h − 0." : "A mola está em E, não em G." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola de torção <b>${sy("kt")}</b>.`, "th", { mode: "pm", coef: "kt", hint: "Rotação da seção.", why: "θ − 0." }));
  if (damp) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("ch")}</b>.`, DRV(wEA), { mode: "pm", coef: "ch", hint: "Em paralelo com k_h.", why: "Derivada da deformação de k_h." }));
  items.push(I.expr("Q", `Q<sub>${conv === "ea" ? "h" : "h<sub>G</sub>"}</sub> =`, `Força generalizada em <b>${sy(h)}</b>.`, "-L", { wrongs: ["L", `-${acArm}*L`], hint: "L é para cima e h positivo é para baixo.", why: "δW = L·(subida do CA) = −L·δh." }));
  items.push(I.expr("Q", "Q<sub>θ</sub> =", "Força generalizada em <b>θ</b>.", `${acArm}*L`, { wrongs: [`-${acArm}*L`, conv === "ea" ? "e*L" : "d*L", conv === "ea" ? "(d + e)*L" : "e*L"], tpl: "foil-qth", hint: "Mexa só θ: quanto o CA sobe?", why: `O CA sobe ${acArm}·δθ (está à frente). δW = L·${acArm}·δθ.` }));
  {
    const cand = [["a rigidez de flexão (mola vertical)", "kh"], ["a rigidez de torção", "kt"], ["a distância de E até o centro de massa", "e"], ["a distância de E até o centro aerodinâmico", "d"]];
    const pool = params.filter((p) => p !== "L");
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("foil", { ctx: K.id, title: K.title, coords, params, names: { hG: ["h", "G"] }, sent, figSVG: SV.wrap(W, H, f, 10), figNote: `${K.n.lead} à esquerda. h positivo para baixo; θ positivo com ${K.n.nose} subindo (horário na figura).`, items });
}

/* =====================================================================
   Família J: disco que rola sem deslizar
   ===================================================================== */
function genDisk() {
  const K = R.pick(SK.disk);
  const useTh = R.flag("diskTh", 0.35), top = R.flag("diskTop", 0.5), unif = R.chance(0.5), pend = false;
  const dampTop = R.chance(0.3), damp = dampTop || R.chance(0.3), fTop = R.flag("diskFtop", 0.4);
  const coords = [useTh ? "th" : "x", ...(pend ? ["ph"] : [])];
  const xc = useTh ? "r*th" : "x", xcd = useTh ? "r*thd" : "xd", om = useTh ? "thd" : "xd/r";
  const params = ["m", "r", ...(unif ? [] : ["J"]), "k1"]; if (top) params.push("k2"); if (damp) params.push("c"); if (pend) params.push("mp", "l", "g"); params.push("F");
  const sent = [];
  sent.push({ tag: "disk", t: K.intro(sy("m"), sy("r"), unif ? null : sy("J")) });
  sent.push({ tag: "roll", t: "Ele rola sem deslizar sobre o piso horizontal." });
  sent.push({ tag: "springs", t: `Uma mola ${sy("k1")} liga o centro do ${K.n.disk} à parede${top ? `, e outra mola ${sy("k2")} liga o <b>ponto mais alto</b> do ${K.n.disk} à mesma parede` : ""}${damp ? `; um amortecedor ${sy("c")} está preso ${dampTop ? "no ponto mais alto" : "no centro"}` : ""}. Todas são horizontais.` });
  if (pend) sent.push({ tag: "pend", t: K.pend(sy("l"), sy("mp")) });
  sent.push({ tag: "force", t: `Uma força horizontal ${sy("F")}(t) atua ${fTop ? "no ponto mais alto" : "no centro"} do ${K.n.disk}.` });
  sent.push({ tag: "coords", t: useTh ? `Coordenada: a rotação θ do ${K.n.disk}, positiva no sentido horário (o ${K.n.disk} rola para a direita)${pend ? ", e o ângulo φ do pêndulo com a vertical (anti-horário positivo)" : ""}.` : `Coordenada: o deslocamento horizontal ${sy("x")} do centro do ${K.n.disk}${pend ? ", e o ângulo φ do pêndulo com a vertical (anti-horário positivo)" : ""}.` });
  if (pend) sent.push({ tag: "grav", t: `Considere a gravidade ${sy("g")} e ângulos pequenos.` });

  const W = 560, H = pend ? 380 : 260, cx = 290, R0 = 60, gy = 200, cy = gy - R0;
  let f = SV.ground(30, W - 20, gy) + SV.wall(40, 40, gy, -1);
  f += `<circle cx="${cx}" cy="${cy}" r="${R0}" fill="var(--accent-soft)" stroke="${INK}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="4" fill="${INK}"/>`;
  f += SV.line(cx, cy, cx + R0 * 0.7, cy + R0 * 0.7, MUT, 1); f += SV.sym(cx + 26, cy + 34, "r", null, "start", MUT); f += SV.sym(cx - 12, cy - 18, "m", null, "end");
  f += SV.spring(40, cy, cx - 4, cy, INK, 8, 6); f += SV.sym(110, cy - 12, "k1");
  if (top) { f += SV.spring(40, cy - R0, cx, cy - R0, INK, 8, 6); f += SV.sym(110, cy - R0 - 12, "k2"); }
  if (damp) { const yd = dampTop ? cy - R0 - 34 : cy + 30; f += SV.damper(40, yd, cx - (dampTop ? 0 : 30), yd); f += SV.sym(110, yd + 28, "c"); if (dampTop) f += SV.line(cx, yd, cx, cy - R0, INK, 1.6); }
  { const yf = fTop ? cy - R0 : cy; f += SV.arrow(cx + 90, yf, cx + (fTop ? 6 : 10), yf, FOR); f += SV.sym(cx + 94, yf + 5, "F", null, "start", FOR, "(t)"); }
  if (useTh) { f += SV.arc(cx, cy, R0 + 14, 120, 60); f += SV.t(cx, cy - R0 - 22, "θ", "middle", ACC); }
  else { f += SV.arrow(cx + 10, cy + R0 + 26, cx + 50, cy + R0 + 26); f += SV.sym(cx + 56, cy + R0 + 31, "x", null, "start", ACC); }
  if (pend) { const yt = cy + 150; f += SV.line(cx, cy, cx, yt, INK, 3) + dot(cx, yt); f += SV.sym(cx + 16, yt + 5, "mp", null, "start"); f += SV.sym(cx - 10, cy + 110, "l", null, "end", MUT); f += SV.arc(cx, cy, 90, -90, -70); f += SV.sym(cx + 40, cy + 100, "ph", null, "start", ACC); f += SV.arrow(W - 40, 40, W - 40, 80, MUT); f += SV.sym(W - 30, 66, "g", null, "start", MUT); }
  const gyFig = pend ? H : H;

  const items = [];
  items.push(readItem(sent, "roll", "Qual frase liga a translação e a rotação do " + K.n.disk + "?", "Rolar sem deslizar: x = rθ. Uma coordenada só basta para o disco."));
  if (top) items.push(readItem(sent, "springs", "Qual frase diz que uma mola está presa <b>fora do centro</b>?", "O ponto mais alto anda 2x (centro + rotação): a deformação dessa mola é 2x."));
  items.push(I.choice("mec", `O <b>${K.n.disk}</b> é:`, BODY, 4, "Translada e gira (rola)."));
  items.push(I.choice("mec", `O <b>ponto de contato</b> do ${K.n.disk} com o piso, naquele instante, é:`, BODY, 0, "Rolando sem deslizar, o ponto de contato tem velocidade nula: ele é o centro instantâneo de rotação."));
  items.push(I.num("Quantos graus de liberdade?", coords.length, `O ${K.n.disk} tem 1 (x e θ estão ligados por x = rθ)${pend ? "; o pêndulo acrescenta 1" : ""}.`));
  if (useTh) items.push(I.expr("pos", "x<sub>C</sub> =", `Deslocamento horizontal do <b>centro</b> do ${K.n.disk}.`, "r*th", { wrongs: ["th", "2*r*th"], hint: "Rolar sem deslizar.", why: "x = r·θ." }));
  else items.push(I.expr("pos", "θ =", `Rotação do ${K.n.disk} (horária positiva).`, "x/r", { wrongs: ["x*r", "2*x/r"], hint: "Rolar sem deslizar.", why: "θ = x/r." }));
  items.push(I.expr("pos", "x<sub>topo</sub> =", `Deslocamento horizontal do <b>ponto mais alto</b> do ${K.n.disk}.`, `2*${xc}`, { wrongs: [xc, useTh ? "2*th" : "x + r"], tpl: "disk-top", hint: "Centro + (rotação × r). O contato está parado.", why: "O ponto mais alto está a 2r do contato (que não anda): anda 2x." }));
  items.push(I.expr("T", "v<sub>C</sub>² =", `Velocidade ao quadrado do <b>centro</b>.`, `(${xcd})^2`, { sq: true, coef: "m", tlabel: K.n.disk + " (translação)", hint: "Derive a posição do centro.", why: "ẋ = rθ̇." }));
  items.push(I.expr("T", "ω² =", `Velocidade angular ao quadrado do <b>${K.n.disk}</b>.`, `(${om})^2`, { wrongs: useTh ? ["(r*thd)^2"] : ["xd^2", "(r*xd)^2"], sq: true, coef: unif ? undefined : "J", coefHTML: unif ? "(m r²/2)" : undefined, coefExpr: unif ? "m*r^2/2" : undefined, tlabel: K.n.disk + " (rotação)", hint: "ω = ẋ/r.", why: useTh ? "ω = θ̇." : "ω = ẋ/r (rolar sem deslizar)." }));
  if (pend) items.push(I.expr("T", "v² =", `Velocidade ao quadrado da massa <b>${sy("mp")}</b> do pêndulo.`, `(${xcd} + l*phd)^2`, { wrongs: [`(${xcd})^2 + l^2*phd^2`, `(${useTh ? "thd" : "xd"} + l*phd)^2`], sq: true, coef: "mp", tlabel: "pêndulo", hint: "O pino anda com o centro; pendurado, o anti-horário leva a ponta para +x.", why: "Mesma direção: (ẋ_C + l·φ̇)²." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("k1")}</b> (no centro).`, xc, { mode: "pm", coef: "k1", hint: "Parede parada.", why: "Deslocamento do centro." }));
  if (top) items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("k2")}</b> (no ponto mais alto).`, `2*${xc}`, { mode: "pm", wrongs: [xc, `${xc} + r`], coef: "k2", hint: "Quanto anda o ponto mais alto?", why: "2x: o topo anda o dobro do centro." }));
  if (pend) items.push(I.expr("V", "V<sub>g</sub> =", "Gravidade do pêndulo (termo inteiro).", "mp*g*l*ph^2/2", { kind: "term", wrongs: ["mp*g*l*ph^2", "-mp*g*l*ph^2/2"], hint: "A massa sobe l(1 − cos φ).", why: "+½ m g l φ²." }));
  if (damp) items.push(I.expr("D", "Δv =", `Velocidade relativa no amortecedor <b>${sy("c")}</b>.`, dampTop ? `2*${xcd}` : xcd, { mode: "pm", wrongs: dampTop ? [xcd] : [`2*${xcd}`], coef: "c", hint: "Velocidade do ponto onde ele está preso.", why: dampTop ? "Topo: 2ẋ." : "Centro: ẋ." }));
  const qf = useTh ? (fTop ? "2*r*F" : "r*F") : fTop ? "2*F" : "F";
  items.push(I.expr("Q", `Q<sub>${useTh ? "θ" : "x"}</sub> =`, `Força generalizada em <b>${sy(coords[0])}</b>.`, qf, { wrongs: useTh ? [fTop ? "r*F" : "2*r*F", "F"] : [fTop ? "F" : "2*F", "F/2"], tpl: "disk-q", hint: "Quanto o ponto da força anda quando a coordenada varia de δ?", why: fTop ? "O topo anda 2δx: δW = 2F δx." : "O centro anda δx." }));
  {
    const cand = [["a mola presa no centro", "k1"], [`a massa do ${K.n.disk}`, "m"], ["o raio", "r"]];
    if (top) cand.push(["a mola presa no ponto mais alto", "k2"]);
    const pool = params.filter((p) => !["F", "g"].includes(p));
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("disk", { ctx: K.id, title: K.title, coords, params, names: { ph: ["φ", ""], mp: ["m", "p"] }, sent, figSVG: SV.wrap(W, gyFig, f, 0), figNote: `Rola sem deslizar.${useTh ? " θ horário positivo." : ""}`, items });
}

/* =====================================================================
   Família K: corpo central com braços flexíveis (drone, avião, satélite)
   ===================================================================== */
function genWings() {
  const K = R.pick(SK.wings);
  const roll = R.flag("wingRoll", 0.45), rel = roll ? R.flag("wingRel", 0.5) : true, gear = K.gear && R.flag("wingGear", 0.7), ct = R.chance(0.3);
  const coords = ["y", ...(roll ? ["ph"] : []), "thR", "thL"];
  const params = ["M", ...(roll ? ["J", "d"] : []), "m", "l", "kt"]; if (ct) params.push("ct"); if (gear) params.push("k"); params.push("F");
  const AR = (v = "") => (roll && rel ? `(ph${v} + thR${v})` : "thR" + v), AL = (v = "") => (roll && rel ? `(ph${v} + thL${v})` : "thL" + v);
  const tipR = (v = "") => `y${v}${roll ? ` + d*ph${v}` : ""} + l*${AR(v)}`, tipL = (v = "") => `y${v}${roll ? ` - d*ph${v}` : ""} - l*${AL(v)}`;
  const defR = roll && !rel ? "thR - ph" : "thR", defL = roll && !rel ? "thL - ph" : "thL";
  const sent = [];
  sent.push({ tag: "body", t: K.body(sy("M"), roll ? sy("J") : null, gear ? sy("k") : null) });
  sent.push({ tag: "arms", t: K.arms(sy("l"), sy("m"), roll ? sy("d") : null) });
  sent.push({ tag: "hinge", t: `Cada ${K.n.arm} se liga ao ${K.n.body} por uma articulação com mola de torção ${sy("kt")}${ct ? ` e amortecedor torcional ${sy("ct")}` : ""}.` });
  sent.push({ tag: "force", t: K.force(sy("F")) });
  sent.push({ tag: "coords", t: `Coordenadas: o deslocamento vertical ${sy("y")} do ${K.n.body} (para cima)${roll ? `, a rolagem φ do ${K.n.body}` : ""} e as rotações θ<sub>R</sub> (${K.n.arm} direit${K.n.armG}) e θ<sub>L</sub> (esquerd${K.n.armG}) ${roll && rel ? `<b>em relação ao ${K.n.body}</b>` : "medidas a partir da horizontal"}. Todos os ângulos são anti-horários positivos e pequenos.` });
  sent.push({ tag: "grav", t: "Despreze a gravidade (deslocamentos a partir do equilíbrio)." });

  const W = 620, H = 300, cx = 310, cy = 130, bw = 80, bh = 44, Lp = 170;
  let f = SV.box(cx - bw / 2, cy - bh / 2, bw, bh, "M");
  [[-1, "L"], [1, "R"]].forEach(([s, k]) => {
    const x0 = cx + (s * bw) / 2, x1 = x0 + s * Lp;
    f += SV.line(x0, cy, x1, cy, INK, 3) + `<circle cx="${x0}" cy="${cy}" r="4" fill="var(--panel)" stroke="${INK}" stroke-width="1.6"/>` + SV.coil(x0 + s * 6 - 4, cy + 6);
    f += dot(x1, cy, 11); f += SV.sym(x1 + s * 18, cy + 5, "m", null, s > 0 ? "start" : "end");
    f += SV.arc(x0, cy, 46, s > 0 ? -10 : 170, s > 0 ? 22 : 202); f += SV.sym(x0 + s * 60, cy - 18 * s + (s < 0 ? 40 : 0), "th" + k, null, "middle", ACC);
  });
  f += SV.sym(cx + 120, cy + 34, "l", null, "middle", MUT);
  if (roll) { f += SV.arc(cx, cy, 34, 200, 250); f += SV.sym(cx - 40, cy - 30, "ph", null, "end", ACC); f += SV.dim([cx, cx + bw / 2], cy - bh / 2 - 26, ["d"]); }
  f += SV.arrow(cx + 14, cy - bh / 2 - 4 - (roll ? 34 : 0), cx + 14, cy - bh / 2 - 36 - (roll ? 34 : 0)); f += SV.sym(cx + 20, cy - bh / 2 - 20 - (roll ? 34 : 0), "y", null, "start", ACC);
  if (gear) { f += SV.spring(cx, cy + bh / 2, cx, 270, INK, 6); f += SV.ground(cx - 40, cx + 40, 270); f += SV.sym(cx + 14, 240, "k", null, "start"); }
  { const xt = cx + bw / 2 + Lp; f += SV.arrow(xt, cy + 64, xt, cy + 14, FOR); f += SV.sym(xt + 8, cy + 54, "F", null, "start", FOR, "(t)"); }

  const items = [];
  items.push(readItem(sent, "coords", `Qual frase diz <b>como os ângulos dos ${K.n.armP}</b> são medidos?`, roll && rel ? "Relativos ao corpo: o ângulo absoluto do braço é φ + θ, e a mola de torção sente só θ." : roll ? "Absolutos: a mola de torção sente θ − φ." : "Sem rolagem, ângulo absoluto e relativo coincidem."));
  items.push(I.choice("mec", `O <b>${K.n.body}</b> é:`, BODY, roll ? 4 : 3, roll ? "Sobe e rola: translação + rotação." : "Só sobe e desce."));
  items.push(I.choice("mec", `Cada <b>${K.n.arm}</b> (sem a massa da ponta) é:`, BODY, 2, "Massa desprezível: só liga a massa da ponta."));
  items.push(I.num("Quantos graus de liberdade?", coords.length, `y${roll ? ", φ" : ""} e um ângulo por ${K.n.arm}.`));
  items.push(I.expr("pos", "y<sub>R</sub> =", `Deslocamento vertical da <b>massa da ponta direita</b>.`, tipR(), { wrongs: [roll && rel ? `y + d*ph + l*thR` : `y - l*thR`, roll ? `y + l*${AR()}` : "l*thR"], tpl: "wing-tipR", hint: "Corpo + braço × ângulo absoluto. Anti-horário levanta a ponta da direita.", why: roll ? `y + d·φ (articulação) + l·(ângulo absoluto ${rel ? "φ + θ_R" : "θ_R"}).` : "y + l·θ_R." }));
  items.push(I.expr("pos", "y<sub>L</sub> =", `Deslocamento vertical da <b>massa da ponta esquerda</b>.`, tipL(), { wrongs: [roll ? `y + d*ph + l*${AL()}` : "y + l*thL", roll && rel ? "y - d*ph - l*thL" : "y - thL"], tpl: "wing-tipL", hint: "Do lado esquerdo, anti-horário abaixa.", why: "Sinais invertidos do lado esquerdo: y − d·φ − l·(ângulo absoluto)." }));
  items.push(I.expr("T", "v² =", `Velocidade ao quadrado da <b>massa da ponta direita</b>.`, `(${tipR("d")})^2`, { wrongs: [`yd^2 + l^2*${AR("d")}^2`], sq: true, coef: "m", tlabel: "ponta direita", hint: "Tudo vertical: some antes de elevar ao quadrado.", why: "Mesma direção: termo cruzado com ẏ." }));
  items.push(I.expr("T", "v² =", `Velocidade ao quadrado da <b>massa da ponta esquerda</b>.`, `(${tipL("d")})^2`, { wrongs: [`(${tipR("d").replace(/R/g, "L")})^2`], sq: true, coef: "m", tlabel: "ponta esquerda", hint: "Derive y_L.", why: "Derivada de y_L." }));
  items.push(I.expr("T", "v² =", `Velocidade ao quadrado do <b>${K.n.body}</b> (CG).`, "yd^2", { sq: true, coef: "M", tlabel: K.n.body, hint: "Coordenada própria.", why: "ẏ." }));
  if (roll) items.push(I.expr("T", "ω² =", `Velocidade angular ao quadrado do <b>${K.n.body}</b>.`, "phd^2", { sq: true, coef: "J", tlabel: K.n.body + " (rolagem)", hint: "Derive φ.", why: "φ̇." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola de torção do <b>${K.n.arm} direit${K.n.armG}</b>.`, defR, { mode: "pm", wrongs: roll && !rel ? ["thR"] : roll ? ["thR + ph"] : [], coef: "kt", hint: "Rotação do braço em relação ao corpo.", why: roll && !rel ? "Ângulos absolutos: θ_R − φ." : "θ_R já é relativo." }));
  items.push(I.expr("V", "Δ =", `Deformação da mola de torção do <b>${K.n.arm} esquerd${K.n.armG}</b>.`, defL, { mode: "pm", wrongs: roll && !rel ? ["thL"] : roll ? ["thL + ph"] : [], coef: "kt", hint: "Rotação relativa.", why: roll && !rel ? "θ_L − φ." : "θ_L." }));
  if (gear) items.push(I.expr("V", "Δ =", `Deformação da mola <b>${sy("k")}</b>.`, "y", { mode: "pm", coef: "k", hint: "Chão parado.", why: "y." }));
  if (ct) items.push(I.expr("D", "Δω =", `Velocidade angular relativa no amortecedor do <b>${K.n.arm} direit${K.n.armG}</b>.`, DRV(defR), { mode: "pm", coef: "ct", hint: "Derive a deformação da mola de torção.", why: "Mesma ligação." }));
  items.push(I.expr("Q", "Q<sub>y</sub> =", "Força generalizada em <b>y</b>.", "F", { wrongs: ["-F", "l*F"], hint: "Mexa só y: tudo sobe junto.", why: "A ponta sobe δy: δW = F δy." }));
  if (roll) items.push(I.expr("Q", "Q<sub>φ</sub> =", "Força generalizada em <b>φ</b>.", rel ? "(d + l)*F" : "d*F", { wrongs: [rel ? "d*F" : "(d + l)*F", "l*F"], tpl: "wing-qph", hint: rel ? "Com θ_R parado (relativo), o braço gira junto com o corpo." : "Com θ_R parado (absoluto), o braço só é levado pela articulação.", why: rel ? "A ponta sobe (d + l)δφ." : "A articulação sobe d·δφ e o braço mantém o ângulo absoluto: a ponta sobe d·δφ." }));
  items.push(I.expr("Q", "Q<sub>θ<sub>R</sub></sub> =", `Força generalizada em <b>θ<sub>R</sub></b>.`, "l*F", { wrongs: ["-l*F", "F", ...(roll ? ["(d + l)*F"] : [])], hint: "Mexa só θ_R.", why: "A ponta sobe l·δθ_R." }));
  items.push(I.expr("Q", "Q<sub>θ<sub>L</sub></sub> =", `Força generalizada em <b>θ<sub>L</sub></b>.`, "0", { wrongs: ["-l*F", "l*F"], hint: "A força está do outro lado.", why: "Mexer o braço esquerdo não move a ponta direita." }));
  {
    const cand = [[`a massa do ${K.n.body}`, "M"], [`a massa na ponta de cada ${K.n.arm}`, "m"], ["a rigidez de torção das articulações", "kt"]];
    if (gear) cand.push([K.n.gear, "k"]);
    const pool = params.filter((p) => !["F", "l", "d"].includes(p));
    R.shuffle(cand).slice(0, 2).forEach(([w, id]) => items.unshift(symItem(w, id, pool)));
  }
  return genEx("wings", { ctx: K.id, title: K.title, coords, params, names: { ph: ["φ", ""], thR: ["θ", "R"], thL: ["θ", "L"] }, sent, figSVG: SV.wrap(W, H, f, 0), figNote: "Ângulos anti-horários positivos (na direita levantam a ponta; na esquerda abaixam).", items });
}

/* ---------- contextos das famílias novas ---------- */
Object.assign(SK, {
  pend: [
    { id: "modelo", dir: "any", title: "Pêndulo em suporte móvel", n: { sup: ["o", "bloco"], pend: ["o", "pêndulo"] },
      sup: (v, m, k, c) => (v ? `Um bloco de massa ${m} está pendurado no teto por uma mola ${k}${cd(c, (x) => ` e um amortecedor ${x}`)} e só se move na vertical.` : `Um bloco de massa ${m} desliza sem atrito num trilho horizontal, preso à parede por uma mola ${k}${cd(c, (x) => ` e um amortecedor ${x}`)}.`),

    { id: "elevador", dir: "v", title: "Elevador com lustre", n: { sup: ["a", "cabine"], pend: ["o", "lustre"] },
      sup: (v, m, k, c) => `Uma cabine de elevador de massa ${m} está suspensa por cabos de rigidez equivalente ${k}${cd(c, (x) => ` e amortecimento ${x}`)}; ela só se move na vertical.`,
      pend: (bar, l, m, J) => (bar ? `Do teto da cabine pende, articulada, uma barra de iluminação uniforme de massa ${m}, comprimento ${l} e momento de inércia ${J} em relação ao CG.` : `Do teto da cabine pende um lustre: haste de comprimento ${l} e massa desprezível, com a luminária de massa ${m} na ponta.`),
      tipK: (k) => `Um cabo elástico horizontal de rigidez ${k} prende a ponta do lustre a um poste fixo ao lado.`,

      pend: (bar, l, m, J) => (bar ? `Do teto pende, articulada, uma barra de apoio uniforme de massa ${m}, comprimento ${l} e momento de inércia ${J} em relação ao CG.` : `Do teto pende uma alça de apoio: haste de comprimento ${l} e massa desprezível, com a pega de massa ${m} na ponta.`),
      tipK: (k) => `Uma tira elástica horizontal de rigidez ${k} liga a ponta da alça a uma coluna fixa da estação.`,
      force: (o, v, F) => (o === "tip" ? `Um passageiro puxa a pega com uma força horizontal ${F}(t).` : `A frenagem aplica no vagão uma força horizontal ${F}(t).`) },
  ],
  shaft: [
    { id: "usina", title: "Turbina-gerador vertical", n: { disc: "massa concentrada" },
      intro: (M, J) => `O eixo de um conjunto turbina-gerador vertical é rígido${M ? `, de massa ${M} e momento de inércia ${J} (transversal) em relação ao CG G` : " e de massa desprezível"}.`,
      brg: (kA, cA, kB, cB) => `Ele é guiado por dois mancais: o inferior A, de rigidez lateral ${kA}${cd(cA, (c) => ` e amortecimento ${c}`)}, e o superior B, de rigidez ${kB}${cd(cB, (c) => ` e amortecimento ${c}`)}.`,
      discs: (Ms) => `Rotor do gerador, turbina e volante são massas concentradas presas ao eixo (${Ms}), nas alturas da figura.`,
      force: (at, F) => `O desbalanceamento produz uma força horizontal ${F}(t) em ${at}.` },
    { id: "bomba", title: "Bomba vertical de poço", n: { disc: "massa concentrada" },
      intro: (M, J) => `Uma bomba vertical tem eixo rígido${M ? ` de massa ${M} e momento de inércia ${J} em relação ao CG G` : " de massa desprezível"}.`,
      brg: (kA, cA, kB, cB) => `O mancal inferior A tem rigidez lateral ${kA}${cd(cA, (c) => ` (amortecimento ${c})`)} e o superior B, ${kB}${cd(cB, (c) => ` (amortecimento ${c})`)}.`,

  const rows = SH.log.map((l) => `<li class="${l.right ? "okrow" : "badrow"}"><b>${money(LADDER[l.L])}</b> · ${PH[l.mc.ph] || "Desafio final"} · ${esc(l.ex.title)}<div>${l.right ? "Acertou." : `Errou. Certa: ${ansText(l.mc, l.item, l.ex)}`}</div><div class="why">${l.mc.why}</div></li>`).join("");
  const title = how === "milhão" ? "Você ganhou R$ 1 milhão!" : how === "parou" ? "Você parou" : how === "tempo" ? "O tempo acabou" : "Fim de jogo";
  app.innerHTML = `<header class="top"><button class="iconbtn" id="back" aria-label="Voltar ao início">${ICON.back}</button><div class="ttl"><span class="kicker">Show da Vibração</span><b>${title}</b></div><span class="pill gold">${ICON.trophy}${money(store.bestShow || 0)}</span></header>
  <main class="menu" style="grid-template-columns:1fr">
    <div class="big-score gold"><div class="trophy">${ICON.trophy}</div><span class="kicker">você leva</span><b>${money(prize)}</b><span class="kicker">recorde ${money(store.bestShow || 0)}</span></div>
    <div class="sumcard"><h3>Suas respostas</h3><ol class="hist">${rows || "<li>Nenhuma resposta.</li>"}</ol>
      <p class="muted">Cada partida sorteia mecanismos novos: o que conta é o raciocínio, não a memória.</p></div>
    <div class="dock"><button class="btn" id="home">Início</button><button class="btn gold" id="again">Jogar de novo</button></div>
  </main>`;
  document.getElementById("again").onclick = startShow;
  document.getElementById("home").onclick = () => { SH = null; home(); };
  document.getElementById("back").onclick = () => { SH = null; home(); };
  SH = null; window.scrollTo({ top: 0 });
}

</script>
<script>
"use strict";
const PH = { trad: "Tradução", ler: "Leitura", mec: "Mecanismo", pos: "Posições", T: "Energia cinética", V: "Molas (V)", D: "Amortecedores (D)", Q: "Forças (Q)" };
const PH_ORDER = ["trad", "ler", "mec", "pos", "T", "V", "D", "Q"];
const KEY = "leitor-mecanismos-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- expressões: parser, avaliação, impressão ---------- */
function norm(s) {
  return s.replace(/θ/g, "th").replace(/[·×]/g, "*").replace(/[−–]/g, "-").replace(/²/g, "^2").replace(/,/g, ".");
}
function tokenize(s) {
  const re = /\s+|\d+(?:\.\d+)?|[A-Za-z_][A-Za-z0-9_]*|[-+*/^()]/y; const out = []; let i = 0;
  while (i < s.length) {
    re.lastIndex = i; const m = re.exec(s);
    if (!m) throw new Error(`Não entendi o caractere “${s[i]}”.`);
    i = re.lastIndex; const t = m[0];
    if (/^\s+$/.test(t)) continue;
    if (/^\d/.test(t)) out.push({ k: "num", v: parseFloat(t) });
    else if (/^[A-Za-z_]/.test(t)) out.push({ k: "id", v: t });
    else out.push({ k: "op", v: t });
  }
  return out;
}
function parse(str) {
  const toks = tokenize(norm(str)); let p = 0;
  const peek = () => toks[p]; const isOp = (v) => toks[p] && toks[p].k === "op" && toks[p].v === v;
  function expr() {
    let a = term();
    while (isOp("+") || isOp("-")) { const op = toks[p++].v; a = { t: "bin", op, a, b: term() }; }
    return a;
  }
  function startsFactor() { const t = peek(); return t && (t.k === "num" || t.k === "id" || (t.k === "op" && t.v === "(")); }
  function term() {
    let a = unary();
    for (;;) {
      if (isOp("*") || isOp("/")) { const op = toks[p++].v; a = { t: "bin", op, a, b: unary() }; }
      else if (startsFactor()) a = { t: "bin", op: "*", a, b: unary() };
      else break;
    }
    return a;
  }
  function unary() {
    if (isOp("-")) { p++; return { t: "neg", a: unary() }; }
    if (isOp("+")) { p++; return unary(); }
    return power();
  }
  function power() {
    const a = primary();
    if (isOp("^")) { p++; return { t: "bin", op: "^", a, b: unary() }; }
    return a;
  }
  function primary() {
    const t = peek();
    if (!t) throw new Error("A expressão terminou no meio.");
    if (t.k === "num") { p++; return { t: "num", v: t.v }; }
    if (t.k === "id") { p++; return { t: "var", n: t.v }; }
    if (t.k === "op" && t.v === "(") {
      p++; const e = expr();
      if (!isOp(")")) throw new Error("Falta fechar um parêntese.");
      p++; return e;
    }
    throw new Error(`“${t.v}” fora do lugar.`);
  }
  if (!toks.length) throw new Error("Digite uma expressão.");
  const e = expr();
  if (p < toks.length) throw new Error(toks[p].v === ")" ? "Tem um “)” sobrando." : `“${toks[p].v}” fora do lugar.`);
  return e;
}
function varsOf(ast, acc = new Set()) {
  if (ast.t === "var") acc.add(ast.n);
  if (ast.a) varsOf(ast.a, acc); if (ast.b) varsOf(ast.b, acc);
  return acc;
}
function ev(ast, env) {
  switch (ast.t) {
    case "num": return ast.v;
    case "var": return env[ast.n];
    case "neg": return -ev(ast.a, env);
    case "bin": {
      const a = ev(ast.a, env), b = ev(ast.b, env);
      if (ast.op === "+") return a + b; if (ast.op === "-") return a - b;
      if (ast.op === "*") return a * b; if (ast.op === "/") return a / b;
      return Math.pow(a, b);
    }
  }
}

/* nomes bonitos: th → θ, x1 → x₁, x1d → ẋ₁, kt → kₜ */
function nameParts(id, ex) {
  if (ex.names && ex.names[id]) return ex.names[id];
  if (id === "D") return ["D", ""];
  if (id.startsWith("th")) return ["θ", id.slice(2)];
  if (id.startsWith("ph")) return ["φ", id.slice(2)];
  return [id[0], id.slice(1)];
}
function isVel(id, ex) { return id.endsWith("d") && id.length > 1 && (ex.coords.includes(id.slice(0, -1)) || id === "thd"); }
function nameHTML(id, ex) {
  let dot = false, base = id;
  if (isVel(id, ex)) { dot = true; base = id.slice(0, -1); }
  const [b, s] = nameParts(base, ex);
  return `<span class="m">${dot ? `<span class="dv">${b}</span>` : b}${s ? `<sub>${s}</sub>` : ""}</span>`;
}
const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, neg: 2.5, "^": 4 };
function pp(ast, ex, parent = 0) {
  let s, prec;
  if (ast.t === "num") { prec = 5; s = String(+ast.v.toFixed(6)).replace(".", ","); }
  else if (ast.t === "var") { prec = 5; s = nameHTML(ast.n, ex); }
  else if (ast.t === "neg") { prec = PREC.neg; s = "−" + pp(ast.a, ex, 3); }
  else {
    prec = PREC[ast.op];
    if (ast.op === "+") s = ast.b.t === "neg" ? pp(ast.a, ex, 1) + " − " + pp(ast.b.a, ex, 2) : pp(ast.a, ex, 1) + " + " + pp(ast.b, ex, 1);
    else if (ast.op === "-") s = pp(ast.a, ex, 1) + " − " + pp(ast.b, ex, 2);
    else if (ast.op === "*") {
      const L = ast.a.t === "bin" && ast.a.op === "/" ? `(${pp(ast.a, ex, 0)})` : pp(ast.a, ex, 2), R = pp(ast.b, ex, 3);
      const sep = ast.a.t === "num" && ast.b.t === "num" ? "·" : (ast.a.t === "num" ? "" : " ");
      s = L + sep + R;
    }
    else if (ast.op === "/") s = pp(ast.a, ex, 2) + "/" + pp(ast.b, ex, 3);
    else s = pp(ast.a, ex, 5) + `<sup>${pp(ast.b, ex, 0)}</sup>`;
  }
  return prec < parent ? `(${s})` : s;
}
const P = (str, ex, parent) => pp(parse(str), ex, parent);
const sqAst = (ast) => ({ t: "bin", op: "^", a: ast, b: { t: "num", v: 2 } });

/* ambiente numérico: parâmetros > 0, estados com sinal, derivados em ordem */
function stateVars(ex) { return ex.coords.concat(ex.coords.map((c) => c + "d")); }
function allowed(ex, item) {
  const s = new Set(stateVars(ex).concat(ex.params).concat((ex.derived || []).map((d) => d[0])));
  (item && item.forbid || []).forEach((f) => s.delete(f));
  return s;
}
const DER = new Map();
function derivedAsts(ex) {
  if (!DER.has(ex.id)) DER.set(ex.id, (ex.derived || []).map(([n, e]) => [n, parse(e)]));
  return DER.get(ex.id);
}
function rawSample(ex) {
  const r = {};
  ex.params.forEach((p) => (r[p] = 0.7 + Math.random() * 1.6));
  stateVars(ex).forEach((v) => (r[v] = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random())));
  return r;
}
function envOf(ex, raw) { const e = { ...raw }; derivedAsts(ex).forEach(([n, a]) => (e[n] = ev(a, e))); return e; }
const close = (u, e) => Math.abs(u - e) <= 1e-7 * (1 + Math.abs(e));

function checkExpr(str, item, ex) {
  let ast;
  try { ast = parse(str); } catch (err) { return { err: err.message }; }
  const ok = allowed(ex, item);
  for (const v of varsOf(ast)) {
    if (!ok.has(v)) {
      if ((item.forbid || []).includes(v)) return { err: `Aqui não vale usar ${nameHTML(v, ex)}: escreva só com as coordenadas.` };
      const split = splitId(v, ok);
      return { err: split ? `Não conheço “${v}”. Quis dizer <b>${split}</b>? Separe os símbolos com espaço ou *.` : `Não conheço o símbolo “${v}”. Use os botões abaixo.` };
    }
  }
  const exp = parse(item.ans);
  const raws = Array.from({ length: 8 }, () => rawSample(ex));
  const pairs = raws.map((r) => { const e = envOf(ex, r); return [ev(ast, e), ev(exp, e)]; });
  if (pairs.some(([u]) => !isFinite(u))) return { err: "A expressão dá divisão por zero." };
  const same = pairs.every(([u, e]) => close(u, e));
  const flip = item.mode === "pm" && pairs.every(([u, e]) => close(u, -e));
  if (same || flip) return { ok: true, ast, flipped: flip && !same };
  return { ok: false, ast, msgs: diagnose(ast, exp, item, ex) };
}
function splitId(v, ok) {
  const names = [...ok].sort((a, b) => b.length - a.length); const parts = []; let rest = v;
  while (rest) { const n = names.find((x) => rest.startsWith(x)); if (!n) return null; parts.push(n); rest = rest.slice(n.length); }
  return parts.length > 1 ? parts.join(" ") : null;
}
function diagnose(ua, ea, item, ex) {
  const raw = rawSample(ex), base = envOf(ex, raw); const msgs = [];
  let sgn = 1;
  if (item.mode === "pm") { const u = ev(ua, base), e = ev(ea, base); sgn = Math.abs(u + e) < Math.abs(u - e) ? -1 : 1; }
  const U0 = ev(ua, base), E0 = sgn * ev(ea, base);
  const eps = 1e-9;
  for (const v of stateVars(ex)) {
    const r2 = { ...raw, [v]: raw[v] + 0.53 }; const e2 = envOf(ex, r2);
    const du = ev(ua, e2) - U0, de = sgn * ev(ea, e2) - E0;
    if (close(du, de)) continue;
    const nm = nameHTML(v, ex);
    if (Math.abs(de) < eps) msgs.push(`Sua resposta depende de ${nm}, mas a certa não depende.`);
    else if (Math.abs(du) < eps) msgs.push(`Está faltando a parte com ${nm}.`);
    else if (!item.sq && close(du, -de)) msgs.push(`A parte com ${nm} está com o sinal trocado.`);
    else if (item.sq) msgs.push(`A parte com ${nm} não bate. Monte a velocidade inteira primeiro e só depois eleve ao quadrado.`);
    else msgs.push(`A parte com ${nm} está com o coeficiente errado (confira o braço ou o fator).`);
    if (msgs.length >= 2) break;
  }
  if (ex.thRule && varsOf(ua).has("th")) msgs.push(ex.thRule);
  if (!msgs.length) msgs.push(stateVars(ex).length && varsOf(ea).size && [...varsOf(ea)].some((v) => stateVars(ex).includes(v))
    ? "As coordenadas estão certas, mas algum parâmetro (massa, braço, fator numérico) não bate."
    : "O valor não bate. Confira quanto o ponto de cada força anda.");
  return msgs;
}

/* ---------- estado do jogo ---------- */
const exById = Object.fromEntries(EXS.map((e) => [e.id, e]));
let S = null; // { mode, exId?, queue:[{ex, item}|{sum}], i, pts, max, log:[] }
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
// texto puro para <option> (não aceita HTML): índices viram subscritos Unicode
const SUBS = { 0: "₀", 1: "₁", 2: "₂", 3: "₃", 4: "₄", 5: "₅", 6: "₆", 7: "₇", 8: "₈", 9: "₉", a: "ₐ", e: "ₑ", h: "ₕ", k: "ₖ", l: "ₗ", m: "ₘ", n: "ₙ", o: "ₒ", p: "ₚ", r: "ᵣ", s: "ₛ", t: "ₜ", x: "ₓ" };
const plainSym = (h) => String(h).replace(/<sub>([^<]*)<\/sub>/g, (_, s) => [...s].map((c) => SUBS[c] || c).join("")).replace(/<[^>]+>/g, "");

function itemKey(ex, item) { return ex.id + ":" + ex.items.indexOf(item); }
function phaseStats(ex) {
  const res = {};
  PH_ORDER.forEach((ph) => {
    const its = ex.items.filter((it) => it.ph === ph); if (!its.length) return;
    const got = its.map((it) => (store[itemKey(ex, it)] || 0));
    res[ph] = { n: its.length, done: got.filter((g) => g >= 2).length, seen: got.filter((g) => g > 0).length };
  });
  return res;
}

const ic = (d) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  back: ic('<path d="M15 18l-6-6 6-6"/>'),
  play: ic('<path d="M7 5l12 7-12 7z"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  trophy: ic('<path d="M8 4h8v5a4 4 0 01-8 0z"/><path d="M8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 21h8M9 17h6"/>'),
  star: ic('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'),
  skip: ic('<path d="M5 5l9 7-9 7z"/><path d="M18 5v14"/>'),
  cards: ic('<rect x="3" y="6" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 012 2v13"/>'),
  users: ic('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5.5"/>'),
  chart: ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  bulb: ic('<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>'),
  dice: ic('<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/>'),
};

function home() {
  S = null;
  const rows = EXS.map((ex) => {
    const st = phaseStats(ex);
    const dots = PH_ORDER.filter((p) => st[p]).map((p) => `<i class="${st[p].done === st[p].n ? "done" : st[p].seen ? "part" : ""}"></i>`).join("");
    return `<button class="row" data-ex="${ex.id}"><span class="n">${ex.n}</span><span><b>${ex.title}</b><small>${ex.src} · ${ex.gl} GL</small></span><span class="dots">${dots}</span></button>`;
  }).join("");
  const drills = PH_ORDER.map((p) => `<button class="chipbtn" data-drill="${p}">${PH[p]}</button>`).join("");
  app.innerHTML = `
  <header class="top"><div class="brand"><span class="logo">${ICON.gear}</span>Show da Vibração</div>${store.bestShow ? `<span class="pill gold">${ICON.trophy}${money(store.bestShow)}</span>` : ""}</header>
  <main class="menu">
    <section class="hello"><span class="kicker">VSM · modelagem para Lagrange · Leitor de Mecanismos</span><h1>Leia o mecanismo.<br><em>Escreva T, V, D e Q.</em></h1>
      <p class="lead">Mecanismos sorteados em contextos reais. Você monta posições, energias e forças; o jogo confere a matemática e aponta onde está o erro.</p>
      ${store.genDone ? `<div class="stats"><span class="pill">${ICON.star}${store.genDone} itens respondidos</span></div>` : ""}</section>
    <button class="tile feature" id="show"><span class="coins">R$ 1 mil → R$ 1 milhão</span><h2>Show da Vibração</h2>
      <p>16 perguntas, cada uma num mecanismo novo: carro, avião, drone, turbina, ponte, torre. Ache o erro, case figura e enunciado, acoplamentos e, a partir de R$ 300 mil, resposta digitada. Errou, leva a metade.</p>
      <span class="go">${ICON.play}Jogar</span></button>
    <label class="tswitch" for="tmr" style="grid-column:1/-1"><span>Cronômetro<small>45 s até R$ 50 mil, 60 s até R$ 500 mil, 90 s no milhão e nas digitadas</small></span><input type="checkbox" id="tmr" ${store.timer === false ? "" : "checked"}></label>
    <section class="tile"><h2>Mecanismo novo</h2><p>Um sistema que você nunca viu, com as 8 fases e respostas digitadas.</p>
      <div class="chiprow"><button class="chipbtn pri" data-gen="any">${ICON.dice} Sortear</button>${Object.keys(GEN).map((k) => `<button class="chipbtn" data-gen="${k}">${GEN_NAMES[k]}</button>`).join("")}</div></section>
    <section class="tile"><h2>Treino por fase</h2><p>12 itens seguidos da mesma fase, cada um de um mecanismo novo.</p><div class="chiprow">${drills}</div></section>
    ${EXS.length ? `<section class="tile"><h2>Provas reais</h2><p>Os exercícios de avaliações e listas do curso.</p><div class="list">${rows}</div></section>` : ""}
    <details class="tile how"><summary>Como digitar as respostas</summary>
      <ol><li>Toque nos botões de símbolo ou digite: <code>x1</code>, <code>th</code> (θ), <code>x1d</code> (ẋ₁), <code>thd</code> (θ̇), <code>^2</code>.</li>
      <li>Qualquer forma equivalente vale: <code>x2 - (b+c)*th</code> e <code>x1 + d th</code> contam igual se forem iguais.</li>
      <li>Errou: o jogo diz qual parte está errada. Depois de 2 erros aparece a resposta.</li></ol></details>
  </main>`;
  app.querySelectorAll("[data-ex]").forEach((b) => (b.onclick = () => startEx(b.dataset.ex)));
  app.querySelectorAll("[data-drill]").forEach((b) => (b.onclick = () => startDrill(b.dataset.drill)));
  app.querySelectorAll("[data-gen]").forEach((b) => (b.onclick = () => startGen(b.dataset.gen)));
  document.getElementById("show").onclick = startShow;
  document.getElementById("tmr").onchange = (e) => { store.timer = e.target.checked; save(); };
  window.scrollTo(0, 0);
}

function buildQueue(ex, fromPh) {
  const q = [];
  PH_ORDER.slice(PH_ORDER.indexOf(fromPh || "ler")).forEach((ph) => {
    const its = ex.items.filter((it) => it.ph === ph); if (!its.length) return;
    its.forEach((item) => q.push({ ex, item }));
    if (["T", "V", "D", "Q"].includes(ph)) q.push({ ex, sum: ph });
  });
  return q;
}
function startEx(id, fromPh) {
  const ex = exById[id];
