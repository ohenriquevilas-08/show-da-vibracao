  render();
}
function newGen(fam) {
  const f = fam && fam !== "any" ? fam : R.pick(Object.keys(GEN));
  const ex = GEN[f](); exById[ex.id] = ex; return ex;
}
function startGen(fam) {
  const ex = newGen(fam);
  S = { mode: "ex", ex, fam, queue: buildQueue(ex), i: 0, pts: 0, max: 0, log: [] };
  render();
}
function startDrill(ph) {
  const q = []; let guard = 0;
  while (q.length < 12 && guard++ < 200) {
    const ex = newGen("any"); const its = ex.items.filter((it) => it.ph === ph);
    if (its.length) q.push({ ex, item: R.pick(its) });
  }
  S = { mode: "drill", ph, queue: q, i: 0, pts: 0, max: 0, log: [] };
  render();
}

/* ---------- tela de jogo ---------- */
function refPanel(ex, extraBtn = "") {
  const leg = ex.coords.map((c) => `<span>${nameHTML(c, ex)}</span>`).join("");
  const fig = ex.figSVG ? `<div class="plate gen">${ex.figSVG}</div>` : `<div class="plate"><img src="${FIGS[ex.fig]}" alt="Figura do exercício ${ex.n}: ${esc(ex.title)}"></div>`;
  return `<div class="refcard" id="ref">
    <div class="tabs"><button class="tab on" data-tab="fig">Figura</button><button class="tab" data-tab="txt">Enunciado</button><button class="tab" data-tab="min" aria-label="Recolher">Recolher</button></div>
    <div class="tabpane" data-pane="fig">${fig}<div class="legend">coordenadas ${leg}</div>${extraBtn}</div>
    <div class="tabpane off" data-pane="txt"><p>${ex.statement}</p><p class="note">${ex.figNote}</p></div></div>`;
}
function bindRef() {
  const ref = document.getElementById("ref"); if (!ref) return;
  ref.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => {
    const t = b.dataset.tab;
    if (t === "min") { ref.classList.toggle("min"); b.textContent = ref.classList.contains("min") ? "Abrir" : "Recolher"; return; }
    ref.classList.remove("min"); ref.querySelector('[data-tab="min"]').textContent = "Recolher";
    ref.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    ref.querySelectorAll(".tabpane").forEach((p) => p.classList.toggle("off", p.dataset.pane !== t));
  }));
}
function render() {
  if (!S) return home();
  if (S.i >= S.queue.length) return finish();
  const cur = S.queue[S.i], ex = cur.ex;
  const phNow = cur.sum || cur.item.ph;
  let pills = "";
  if (S.mode === "ex") {
    const st = phaseStats(ex);
    pills = `<div class="phases">${PH_ORDER.filter((p) => st[p]).map((p) => `<button data-ph="${p}" class="${p === phNow ? "on" : ""} ${st[p].done === st[p].n ? "done" : ""}">${PH[p]}</button>`).join("")}</div>`;
  }
  const total = S.queue.filter((x) => x.item).length, idx = S.queue.slice(0, S.i).filter((x) => x.item).length + (cur.item ? 1 : 0);
  const reroll = S.mode === "ex" && ex.gen ? `<div class="chiprow" style="margin-top:10px"><button class="chipbtn" id="reroll">${ICON.dice} Sortear outro mecanismo</button></div>` : "";
  app.innerHTML = `
  <header class="top"><button class="iconbtn" id="back" aria-label="Voltar ao início">${ICON.back}</button>
    <div class="ttl"><span class="kicker">${S.mode === "ex" ? `${ex.gen ? "Mecanismo novo" : "Exercício " + ex.n} · ${ex.gl} GL · ${idx}/${total}` : `Treino · ${idx}/${total}`}</span><b>${S.mode === "ex" ? ex.title : PH[S.ph]}</b></div>
    <span class="pill gold">${ICON.star}<b id="pts">${S.pts}</b></span></header>
  <div class="prog"><i style="width:${Math.round((100 * (idx - 1)) / Math.max(1, total))}%"></i></div>
  <main class="stage"><aside class="ref">${refPanel(ex, reroll)}</aside><section class="play">${pills}<div id="slot" class="play"></div></section></main>`;
  document.getElementById("back").onclick = home;
  const rr = document.getElementById("reroll"); if (rr) rr.onclick = () => startGen(S.fam);
  app.querySelectorAll("[data-ph]").forEach((b) => (b.onclick = () => { const fam = S.fam; startEx(ex.id, b.dataset.ph); S.fam = fam; }));
  bindRef();
  const on = app.querySelector(".phases .on"); if (on) on.parentElement.scrollLeft = on.offsetLeft - 16;
  const slot = document.getElementById("slot");
  if (cur.sum) renderSummary(slot, ex, cur.sum); else renderItem(slot, ex, cur.item);
}

function next() { S.i++; render(); window.scrollTo({ top: 0 }); }

function award(ex, item, pts, firstTry) {
  S.pts += pts; S.max += 3; S.log.push({ ex, item, pts });
  if (ex.gen) { store.genDone = (store.genDone || 0) + 1; save(); return; }
  const k = itemKey(ex, item); store[k] = Math.max(store[k] || 0, pts === 0 ? 1 : pts); save();
}

function renderItem(slot, ex, item) {
  const st = { tries: 0, hint: false, done: false };
  const head = `<span class="kicker">${PH[item.ph]}${S.mode === "drill" ? ` · ${esc(ex.title)}` : ""}${ex.gen ? " " + eggHTML(ex) : ""}</span><div class="q">${item.q}</div>`;
  let body = "";
  if (item.type === "choice") body = `<div class="opts">${item.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="let">${"ABCDEF"[i]}</span><span>${o}</span></button>`).join("")}</div>`;
  else if (item.type === "number") body = `<div class="exprrow num"><input id="inp" type="number" inputmode="numeric" min="0" step="1" aria-label="Resposta"></div>`;
  else if (item.type === "match") {
    const descs = item.pairs.map((p) => p[1]).concat(item.extra || []).sort(() => Math.random() - 0.5);
    body = `<div class="match">${item.pairs.map((p, i) => `<label><span class="lhs">${nameHTML(p[0], ex)}</span><select data-i="${i}" aria-label="O que ${p[0]} mede"><option value="">escolha…</option>${descs.map((d) => `<option value="${esc(d).replace(/"/g, "&quot;")}">${plainSym(d)}</option>`).join("")}</select></label>`).join("")}</div>`;
  } else body = exprPad(ex, item);
  slot.innerHTML = `<div class="card-q" id="card">${head}${body}<div id="fb"></div></div>
    <div class="dock"><button class="btn ghost" id="hint">${ICON.bulb}Dica</button><button class="btn" id="show" hidden>Ver resposta</button><button class="btn pri" id="go">Conferir</button><button class="btn pri" id="nx" hidden>Próximo ${ICON.play}</button></div>`;
  const $ = (id) => slot.querySelector("#" + id);
  bindEgg(slot);
  const fb = $("fb"); const inp = $("inp"); const card = $("card");
  const flash = (cls) => { card.classList.remove("pop", "shake"); void card.offsetWidth; card.classList.add(cls); };
  let choice = null;
  if (item.type === "choice") slot.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
    if (st.done || b.disabled) return;
    slot.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); choice = +b.dataset.i; check();
  }));
  if (item.type === "expr") bindPad(slot, ex);
  if (inp) inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); st.done ? next() : check(); } });
  $("go").onclick = check;
  if (item.type === "choice") $("go").hidden = true;
  $("hint").onclick = () => { st.hint = true; showFb("hint", "Dica", item.hint || hintFor(item)); $("hint").disabled = true; };
  $("show").onclick = () => reveal();
  $("nx").onclick = next;

  function showFb(cls, title, html) { fb.innerHTML = `<div class="fb ${cls}"><b class="t">${title}</b><div>${html}</div></div>`; if (window.innerWidth < 960) fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  function answerHTML() {
    if (item.type === "choice") return item.opts[item.ans];
    if (item.type === "number") return String(item.ans);
    if (item.type === "match") return item.pairs.map((p) => `${nameHTML(p[0], ex)}: ${p[1]}`).join("<br>");
    return `<span class="ans">${item.lhs} ${P(item.ans, ex)}</span>`;
  }
  function finishItem(pts, title) {
    st.done = true; award(ex, item, pts);
    $("go").hidden = true; $("hint").hidden = true; $("show").hidden = true; $("nx").hidden = false;
    if (inp) inp.disabled = true;
    slot.querySelectorAll(".opt,select,.chip").forEach((x) => (x.disabled = true));
    const extra = item.type === "expr" ? `<div class="ans">${item.lhs} ${P(item.ans, ex)}</div>` : "";
    showFb(pts > 0 ? "ok" : "bad", title, `${extra}<div>${item.why}</div>`);
    if (pts > 0) flash("pop");
    const sc = document.getElementById("pts"); if (sc) sc.textContent = S.pts;
  }
  function wrong(msgHTML) {
    st.tries++; flash("shake");
    if (st.tries >= 2) $("show").hidden = false;
    showFb("bad", st.tries >= 2 ? "Ainda não" : "Não é isso", msgHTML + (st.tries === 1 && !st.hint ? "<div style='margin-top:4px;color:var(--muted)'>Tente de novo ou peça a dica.</div>" : ""));
  }
  function ptsNow() { return st.tries === 0 && !st.hint ? 3 : st.tries <= 1 ? 2 : 1; }
  function reveal() {
    if (item.type === "choice") slot.querySelectorAll(".opt").forEach((b) => +b.dataset.i === item.ans && b.classList.add("ok"));
    finishItem(0, "Resposta");
    fb.querySelector(".fb > div").insertAdjacentHTML("afterbegin", item.type === "expr" ? "" : `<div class="ans">${answerHTML()}</div>`);
  }
  function check() {
    if (st.done) return;
    if (item.type === "choice") {
      if (choice === null) return showFb("hint", "Escolha uma opção", "Toque numa das alternativas.");
      const b = slot.querySelector(`.opt[data-i="${choice}"]`);
      if (choice === item.ans) { b.classList.add("ok"); return finishItem(ptsNow(), "Certo"); }
      b.classList.add("bad"); b.disabled = true; choice = null;
      return wrong("Releia o trecho e a figura.");
    }
    if (item.type === "number") {
      const v = inp.value.trim(); if (v === "") return showFb("hint", "Digite um número", "Quantos?");
      if (+v === item.ans) return finishItem(ptsNow(), "Certo");
      return wrong(+v > item.ans ? "É menos. Algo que você contou não tem massa, não se move ou é imposto?" : "É mais. Conte de novo os movimentos independentes.");
    }
    if (item.type === "match") {
      const sels = [...slot.querySelectorAll("select")];
      if (sels.some((s) => !s.value)) return showFb("hint", "Complete todas", "Escolha uma descrição para cada coordenada.");
      let bad = 0;
      sels.forEach((s) => { const good = s.value === item.pairs[+s.dataset.i][1]; s.classList.toggle("ok", good); s.classList.toggle("bad", !good); if (!good) bad++; });
      if (!bad) return finishItem(ptsNow(), "Certo");
      return wrong(`${bad} ${bad > 1 ? "estão erradas" : "está errada"} (em vermelho).`);
    }
    const v = inp.value.trim();
    if (!v) return showFb("hint", "Digite a expressão", "Use os botões de símbolo se preferir.");
    const r = checkExpr(v, item, ex);
    if (r.err) return showFb("hint", "Não consegui ler", r.err);
    if (r.ok) return finishItem(ptsNow(), r.flipped ? "Certo (sinal invertido, que no quadrado não importa)" : "Certo");
    wrong(`<div>Você escreveu: <span class="ans">${pp(r.ast, ex)}</span></div><ul>${r.msgs.map((m) => `<li>${m}</li>`).join("")}</ul>`);
  }
}
// campo de expressão com teclado de símbolos (treino e perguntas digitadas da Escada)
function exprPad(ex, item) {
  const al = [...allowed(ex, item)];
  const row = (lab, ids) => ids.length ? `<div><small>${lab}</small>${ids.map((v) => `<button class="chip" data-ins="${v}">${nameHTML(v, ex)}</button>`).join("")}</div>` : "";
  const coords = ex.coords.filter((c) => al.includes(c)), vels = ex.coords.map((c) => c + "d").filter((c) => al.includes(c));
  const der = (ex.derived || []).map((d) => d[0]).filter((d) => al.includes(d));
  return `<div class="exprrow"><span class="lhs">${item.lhs}</span><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Expressão"></div>
      <div class="preview" id="pv"></div>
      <div class="keys"><div><small>operar</small>${["+", "−", "*", "/", "(", ")", "^2", "⌫"].map((o) => `<button class="chip op" data-op="${o}" aria-label="${o === "⌫" ? "Apagar" : o}">${o === "*" ? "·" : o}</button>`).join("")}</div>${row("coord.", coords)}${row("veloc.", vels)}${row("param.", ex.params.filter((p) => al.includes(p)))}${row("atalhos", der)}</div>`;
}
function bindPad(root, ex, onChange) {
  const inp = root.querySelector("#inp"), pv = root.querySelector("#pv");
  const upd = () => {
    if (!inp.value.trim()) { pv.className = "preview"; pv.innerHTML = ""; }
    else try { const a = parse(inp.value); pv.className = "preview"; pv.innerHTML = `<span class="lab">você escreveu</span>${pp(a, ex)}`; }
    catch (e) { pv.className = "preview err"; pv.textContent = e.message; }
    if (onChange) onChange(inp.value);
  };
  inp.addEventListener("input", upd);
  const insert = (txt) => {
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s, v = inp.value;
    if (txt === "⌫") { const a = s === e ? Math.max(0, s - 1) : s; inp.value = v.slice(0, a) + v.slice(e); inp.setSelectionRange(a, a); return upd(); }
    const pre = v.slice(0, s), needSp = /[A-Za-z0-9)]$/.test(pre) && /^[A-Za-z0-9(]/.test(txt);
    const add = (needSp ? " " : "") + txt;
    inp.value = pre + add + v.slice(e); const c = s + add.length; inp.setSelectionRange(c, c); upd();
  };
  root.querySelectorAll("[data-ins]").forEach((b) => (b.onclick = () => insert(b.dataset.ins)));
  root.querySelectorAll("[data-op]").forEach((b) => (b.onclick = () => insert(b.dataset.op === "−" ? " - " : b.dataset.op === "+" ? " + " : b.dataset.op)));
  return inp;
}
function hintFor(item) {
  if (item.ph === "mec") return "Pergunte: tem massa? Se move sozinho, é empurrado pela pista, ou está parado?";
  return "Releia o trecho do enunciado que fala dessa peça.";
}

function renderSummary(slot, ex, ph) {
  const its = ex.items.filter((it) => it.ph === ph && it.type === "expr");
  let eq = "", lead = "", extra = "";
  if (ph === "T") {
    lead = "Energia cinética montada: cada massa com ½·m·v², cada corpo que gira com ½·J·ω².";
    eq = "T = " + its.map((it) => `${it.mult > 1 ? it.mult + "·" : ""}½ ${it.coefHTML ? `<span class="m">${it.coefHTML}</span>` : nameHTML(it.coef, ex)} ${P(it.ans, ex, 2.6)}`).join(" + ");
    if (ex.id === "t261") extra = "Com J<sub>B</sub> = J<sub>o</sub> − M a² (Steiner), porque o pino O se move.";
  } else if (ph === "V") {
    lead = "Energia potencial: cada mola com ½·k·Δ².";
    eq = "V = " + its.map((it) => it.kind === "term" ? P(it.ans, ex) : `${it.mult > 1 ? it.mult + "·" : ""}½ ${nameHTML(it.coef, ex)} ${pp(sqAst(parse(it.ans)), ex)}`).join(" + ");
  } else if (ph === "D") {
    lead = "Dissipação: cada amortecedor com ½·c·Δv².";
    eq = its.length ? "D = " + its.map((it) => `½ ${nameHTML(it.coef, ex)} ${pp(sqAst(parse(it.ans)), ex)}`).join(" + ") : "[C] = 0,01·[K]: D tem a mesma forma de V, com velocidades e 1% das rigidezes.";
    if (ex.id === "i12") extra = "As outras juntas seguem o mesmo padrão: ½ c<sub>t</sub>[θ̇₁² + (θ̇₂ − θ̇₁)² + (θ̇₃ − θ̇₂)² + (θ̇₄ − θ̇₃)²].";
  } else {
    lead = "Forças generalizadas: Q<sub>i</sub> = o que multiplica δq<sub>i</sub> em δW.";
    eq = its.map((it) => `${it.lhs} ${P(it.ans, ex)}`).join("&emsp;&emsp;");
    extra = "Coordenadas não listadas aqui têm Q = 0 ou seguem o mesmo padrão.";
  }
  slot.innerHTML = `<div class="sumcard"><span class="kicker">${PH[ph]} · fechamento</span><h2>${ph === "Q" ? "Vetor de forças" : "Montando " + ph}</h2><p>${lead}</p><div class="eq">${eq}</div>${extra ? `<p class="muted">${extra}</p>` : ""}
    <p class="muted">Daqui em diante é Lagrange: derivar e organizar em [M], [C], [K] e {Q}.</p></div>
    <div class="dock"><button class="btn pri" id="nx">Continuar ${ICON.play}</button></div>`;
  slot.querySelector("#nx").onclick = next;
}

function finish() {
  const by = {};
  S.log.forEach(({ item, pts }) => { const p = item.ph; by[p] = by[p] || { got: 0, max: 0, miss: 0 }; by[p].got += pts; by[p].max += 3; if (pts < 2) by[p].miss++; });
  const tiles = PH_ORDER.filter((p) => by[p]).map((p) => `<div>${PH[p]}<b>${Math.round(100 * by[p].got / by[p].max)}%</b>${by[p].miss ? `${by[p].miss} para rever` : "limpo"}</div>`).join("");
  const weak = S.log.filter((l) => l.pts < 2).slice(0, 8).map(({ item }) => `<li class="badrow">${item.q}<div class="why">${item.why}</div></li>`).join("");
  const ex = S.ex;
  app.innerHTML = `<header class="top"><button class="iconbtn" id="back" aria-label="Voltar ao início">${ICON.back}</button><div class="ttl"><span class="kicker">${S.mode === "ex" ? esc(ex.title) : "Treino por fase"}</span><b>Fim da rodada</b></div></header>
  <main class="menu" style="grid-template-columns:1fr">
    <div class="big-score"><span class="kicker">pontos</span><b>${S.pts}</b><span class="kicker">de ${S.max}</span></div>
    <div class="sumcard"><div class="tally">${tiles}</div>${weak ? `<h3>Para rever</h3><ul class="hist">${weak}</ul>` : "<p>Tudo de primeira ou com uma tentativa.</p>"}</div>
    <div class="dock"><button class="btn" id="home">Início</button><button class="btn pri" id="again">${S.mode === "ex" && ex.gen ? "Sortear outro" : "Jogar de novo"}</button></div>
  </main>`;
  app.querySelector("#again").onclick = () => (S.mode === "drill" ? startDrill(S.ph) : ex.gen ? startGen(S.fam) : startEx(ex.id));
  app.querySelector("#home").onclick = home; app.querySelector("#back").onclick = home;
  window.scrollTo({ top: 0 });
}

home();
</script>
